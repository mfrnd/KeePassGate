        - $ref: "#/components/parameters/EntryUuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, value]
              additionalProperties: false
              properties:
                # A name every route would refuse was made with `201` and could never be read,
                # changed or stripped afterwards. A carriage return cost more: the file reads one
                # back as a line feed, so `api\rkey` and `api\nkey` were two names until the next
                # unlock and one after it, and a client holding only `create` could write beside a
                # protected field and find its own value there, in clear. The bidirectional
                # controls are refused because KeePass acts on what a name says, as the attachment
                # name beside `createAttachment` explains, and the rest of the format characters
                # because a name holding them is drawn as the name without them: a client could
                # put a second, unprotected `Password` beside the real `Password`.
                name:
                  type: string
                  minLength: 1
                  maxLength: 512
                  description: |
                    A name the routes can name again: a name holding any control character, line
                    breaks and tabs included, a name that decodes into a climb such as `a/../b`, or
                    a name holding any Unicode format character, general category Cf, is
                    `400 malformed`. The format characters are the bidirectional controls and
                    every character drawn as nothing at all, such as the zero-width spaces and
                    joiners, the soft hyphen and the byte order mark. A name its routes could not
                    carry is `400 malformed` as well: percent-encoded, each byte of its UTF-8
                    beyond ASCII takes three characters of the path, and a route naming it may
                    not run past the 2048 characters of a target the transport reads. A name the
                    entry carries, or a name the database cannot tell from a name it carries, is
                    `409`. Looking like another name in any other way, by a letter of another
                    script or a space at its end, is not refused.
                value:
                  type: string
                  maxLength: 65536
                  description: |
                    Line breaks, tabs and bidirectional controls are allowed here, since notes are
                    a field like any other and right to left text is ordinary there. A value of
                    whitespace and nothing else, line breaks and tabs included, is
                    `400 malformed`, as `Malformed` explains, since the file would read it back
                    empty.
                # A string because a request body on this wire carries no booleans. §505
                protected:
                  type: string
                  minLength: 4
                  maxLength: 5
                  description: |
                    `true` or `false`, spelled out, because a request body on this wire carries
                    strings and nothing else. `true` protects the value whatever it is called.
                    `false` and absent mean the same: whatever the database protects under that
                    name, so `Password` is stored protected either way, since `false` cannot take
                    away a protection the database gives. Anything else is refused rather than
                    read as `false`, so a marker this gate cannot read never stores a secret in
                    clear.
      responses:
        "201":
          $ref: "#/components/responses/Made"
        "400":
          $ref: "#/components/responses/Malformed"
        "401":
          $ref: "#/components/responses/Unpaired"
        "404":
          $ref: "#/components/responses/Unreachable"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/EntryTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"

  /entries/{uuid}/fields/{name}:
    parameters:
      - $ref: "#/components/parameters/IfMatch"
    get:
      operationId: readField
      summary: One string's value.
      description: |
        The string the entry holds under this name, and `404` for a name it does not hold, a
        standard field it does not carry among them, while `readEntry` leaves such a field out of
        `fields`. Only an entry neither KeePass nor the gate made can lack one of the five, since
        both make all five and the gate empties one rather than taking it off: an entry written by
        other software, or imported from another program's format and not edited in KeePass since.
      # The `404` is the answer `updateField` gives on the same path, which changes only a string
      # that is there: a read answering `""` would promise a string an update is then refused.
      x-kpg-verb: read
      parameters:
        - $ref: "#/components/parameters/EntryUuid"
        - $ref: "#/components/parameters/FieldName"
      responses:
        "200":
          description: The field.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Field"
        "401":
          $ref: "#/components/responses/Unpaired"
        "404":
          $ref: "#/components/responses/Unreachable"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/EntryTooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
    head:
      operationId: headField
      summary: The same, without the content.
      description: |
        Runs what its `get` runs, on the same handler, and answers without the content.
        Declared rather than derived, and governed by the same `x-kpg-verb`: this document's
        own description says why.
      x-kpg-verb: read
      parameters:
        - $ref: "#/components/parameters/EntryUuid"
        - $ref: "#/components/parameters/FieldName"
      responses:
        "200":
          description: There, and reachable by this client.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          $ref: "#/components/responses/Unpaired"
        "404":
          $ref: "#/components/responses/Unreachable"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/EntryTooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      operationId: updateField
      summary: Change a string this entry already has.
      description: |
        Refused when there is no such name, which is what makes this different from a create. What
        it does not change is whether the field is protected: that is something the operator
        arranged, and writing a value is not the moment to decide it differently. A value the field
        already holds writes nothing, as the description at the top says of every update.
      x-kpg-verb: update
      parameters:
        - $ref: "#/components/parameters/EntryUuid"
        - $ref: "#/components/parameters/FieldName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              additionalProperties: false
              properties:
                value:
                  type: string
                  maxLength: 65536
                  description: |
                    As `createField` takes a value: line breaks, tabs and bidirectional controls
                    are allowed, and a value of whitespace and nothing else is `400 malformed`.
      responses:
        "200":
          $ref: "#/components/responses/Done"
        "400":
          $ref: "#/components/responses/Malformed"
        "401":
          $ref: "#/components/responses/Unpaired"
        "404":
          $ref: "#/components/responses/Unreachable"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/EntryTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: stripField
      summary: Take a string off an entry.
      description: |
        A strip rather than a delete: it removes a part of the entry and leaves the entry, so it is
        granted by `strip` on the entry and never touches whether the entry itself may be removed.
        The five standard fields every entry has are emptied with `updateField` rather than taken
        off, and a strip of one is a conflict.

        A removal asks no switch, and a protected field is refused only when the same rule could
        create in its place and could not have created a protected value there, which is `404`
        as any refusal is. A rule that may strip and may not create takes a protected field off.
      # The five are emptied because KeePass makes all five on every entry and its editor writes
      # all five back on OK, and an entry left without its title read as an empty title in a
      # listing and as no title at all in a read, which a client cannot tell from a value it was
      # refused. The protected case is asked because a strip takes the string off and with it the
      # only mark saying the name held a secret, so the create that follows would read as an
      # ordinary one and store whatever the caller sent, in clear, under the credential's name.
      x-kpg-verb: strip
      parameters:
        - $ref: "#/components/parameters/EntryUuid"
        - $ref: "#/components/parameters/FieldName"
      responses:
        "200":
          $ref: "#/components/responses/Done"
        "401":
          $ref: "#/components/responses/Unpaired"
        "404":
          $ref: "#/components/responses/Unreachable"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"

  /entries/{uuid}/attachments:
    parameters:
      - $ref: "#/components/parameters/IfMatch"
    get:
      operationId: listAttachments
      summary: The names and sizes of an entry's attachments.
      description: |
        The size stays where a field's length does not, because a client has to decide whether to
        ask for something before it asks and an attachment can be megabytes.
      x-kpg-verb: list
      x-kpg-attachments: true
      parameters:
        - $ref: "#/components/parameters/EntryUuid"
      responses:
        "200":
          description: The attachments.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentList"
        "401":
          $ref: "#/components/responses/Unpaired"
        "404":
          $ref: "#/components/responses/Unreachable"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "503":
          $ref: "#/components/responses/Unavailable"
    head:
      operationId: headAttachments
      summary: The same, without the content.
      description: |
        Runs what its `get` runs, on the same handler, and answers without the content.
        Declared rather than derived, and governed by the same `x-kpg-verb`: this document's
        own description says why.
      x-kpg-verb: list
      x-kpg-attachments: true
      parameters:
        - $ref: "#/components/parameters/EntryUuid"
      responses:
        "200":
          description: There, and reachable by this client.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          $ref: "#/components/responses/Unpaired"
        "404":
          $ref: "#/components/responses/Unreachable"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createAttachment
      summary: Add an attachment this entry does not have.
      x-kpg-verb: create
      x-kpg-attachments: true
      parameters:
        - $ref: "#/components/parameters/EntryUuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, content]
              additionalProperties: false
              properties:
                # The bidirectional controls are refused because KeePass acts on what a name says:
                # it lists an attachment under its name and opens one it cannot show itself with
                # whatever Windows starts for the real suffix, so a name ending in the right to
                # left override and then `fdp.exe` is listed as ending in `.pdf` and started as a
                # program on the operator's double click.
                name:
                  type: string
                  minLength: 1
                  maxLength: 512
                  description: |
                    A name the routes can name again: a name holding any control character, line
                    breaks and tabs included, a name that decodes into a climb such as `a/../b`, or
                    a name holding any Unicode format character, general category Cf, is
                    `400 malformed`. The format characters are the bidirectional controls and
                    every character drawn as nothing at all, such as the zero-width spaces and
                    joiners, the soft hyphen and the byte order mark. A name its routes could not
                    carry is `400 malformed` as well: percent-encoded, each byte of its UTF-8
                    beyond ASCII takes three characters of the path, and a route naming it may
                    not run past the 2048 characters of a target the transport reads. A name the
                    entry carries, or a name the database cannot tell from a name it carries, is
                    `409`. Looking like another name in any other way, by a letter of another
                    script or a space at its end, is not refused.
                content:
                  type: string
                  maxLength: 699052
                  description: |
                    The bytes, base64 encoded as `readAttachment` answers them: at most 524288,
                    the largest attachment a read hands out, which is the length above in base64.
                    A string that does not decode as base64, or decodes to more bytes than that,
                    is `400 malformed`.
      responses:
        "201":
          $ref: "#/components/responses/Made"
        "400":
          $ref: "#/components/responses/Malformed"
        "401":
          $ref: "#/components/responses/Unpaired"
        "404":
          $ref: "#/components/responses/Unreachable"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"

  /entries/{uuid}/attachments/{name}:
    parameters:
      - $ref: "#/components/parameters/IfMatch"
    get:
      operationId: readAttachment
      summary: One attachment's contents, base64 encoded.
      x-kpg-verb: read
      x-kpg-attachments: true
      parameters:
        - $ref: "#/components/parameters/EntryUuid"
        - $ref: "#/components/parameters/AttachmentName"
      responses:
        "200":
          description: The attachment.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "401":
          $ref: "#/components/responses/Unpaired"
        "404":
          $ref: "#/components/responses/Unreachable"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/TooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
    head:
      operationId: headAttachment
      summary: The same, without the content.
      description: |
        Runs what its `get` runs, on the same handler, and answers without the content.
        Declared rather than derived, and governed by the same `x-kpg-verb`: this document's
        own description says why.
      x-kpg-verb: read
      x-kpg-attachments: true
      parameters:
        - $ref: "#/components/parameters/EntryUuid"
        - $ref: "#/components/parameters/AttachmentName"
      responses:
        "200":
          description: There, and reachable by this client.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          $ref: "#/components/responses/Unpaired"
        "404":
          $ref: "#/components/responses/Unreachable"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/TooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      operationId: updateAttachment
      summary: Replace an attachment this entry already has.
      description: |
        Content the attachment already holds, byte for byte, writes nothing, as the description at
        the top says of every update.
      x-kpg-verb: update
      x-kpg-attachments: true
      parameters:
        - $ref: "#/components/parameters/EntryUuid"
        - $ref: "#/components/parameters/AttachmentName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              additionalProperties: false
              properties:
                content:
                  type: string
                  maxLength: 699052
                  description: |
                    As `createAttachment` takes it: the bytes, base64 encoded, at most 524288 of
                    them, and `400 malformed` for a string that does not decode or decodes to more.
      responses:
        "200":
          $ref: "#/components/responses/Done"
        "400":
          $ref: "#/components/responses/Malformed"
        "401":
          $ref: "#/components/responses/Unpaired"
        "404":
          $ref: "#/components/responses/Unreachable"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: stripAttachment
      summary: Take an attachment off an entry.
      description: |
        A strip rather than a delete, for the same reason as a field: it removes a part and leaves
        the entry. The attachment switch is not asked about for it, because removing shows nobody
        anything.
      x-kpg-verb: strip
      x-kpg-attachments: true
      parameters:
        - $ref: "#/components/parameters/EntryUuid"
        - $ref: "#/components/parameters/AttachmentName"
      responses:
        "200":
          $ref: "#/components/responses/Done"
        "401":
          $ref: "#/components/responses/Unpaired"
        "404":
          $ref: "#/components/responses/Unreachable"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"

  /entries/{uuid}/access:
    get:
      operationId: getEntryAccess
      summary: What this client may do at this entry, profile by profile.
      description: |
        The same question as a group's, asked of an entry, and its fields and attachments with it:
        neither is a node of its own, so what a rule says about them is said on the entry. It is
        written to the audit as a group's is.
      x-kpg-verb: any
      parameters:
        - $ref: "#/components/parameters/EntryUuid"
      responses:
        "200":
          description: What each profile may do here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Access"
        "401":
          $ref: "#/components/responses/Unpaired"
        "404":
          $ref: "#/components/responses/Unreachable"
        "503":
          $ref: "#/components/responses/Unavailable"
    head:
      operationId: headEntryAccess
      summary: The same, without the content.
      description: |
        Runs what its `get` runs, on the same handler, and answers without the content.
        Declared rather than derived, and governed by the same `x-kpg-verb`: this document's
        own description says why.
      x-kpg-verb: any
      parameters:
        - $ref: "#/components/parameters/EntryUuid"
      responses:
        "200":
          description: There, and this client may do something here.
        "401":
          $ref: "#/components/responses/Unpaired"
        "404":
          $ref: "#/components/responses/Unreachable"
        "503":
          $ref: "#/components/responses/Unavailable"

components:
  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          description: |
            A fixed word or phrase, matched whole rather than parsed, except where a response names
            its body a sentence: the transport's refusals but its `417`, and `EntryTooLarge` and
            `TooLarge`, each known by its status. Where several share a status, the response
            declaring them names what each means, and those are the words worth matching on,
            because each is a different thing for a client to do next: `locked`, `undecided` and
            `busy` on a `503`; `proof` on a `401` from pairing; `no invitation` and `no exchange` on
            a `409` from pairing, and `this session`, `too early` and `forever` on a `409` from
            renewal; `malformed`, `name` and `profile` on a `400` from `pairRequest`; and
            `not saved`, `not verified`, `not recorded` and `internal error` on a `500`. The rest
            are told apart by the status and read by a person. None of them carries anything the
            caller sent back to it.

    Identity:
      type: object
      required:
        [subject, clientKey, admissionKey, expires, profiles, removedProfiles, profilesUnreadable]
      additionalProperties: false
      description: |
        The audit names a client under these same two names, so a program can find its own lines
        there, though not every line carries both. A line about a request this certificate made
        while admitted names both, and so does a renewal's line and a revocation's. A line about a
        certificate this database issued and the gate refused, because it was revoked, has expired
        or is not a client certificate, names its `admissionKey` alone, since no record stands
        behind it to carry a `clientKey`. A pairing's line names only the certificate it issued,
        as its `clientKey`, and neither key when it issued none, and the operator's revocation
        leaves the `clientKey` out when the record was already gone.
      properties:
        subject:
          type: string
          description: The certificate's subject, `CN=` and the name the client paired under.
        clientKey:
          type: string
          description: |
            The key the operator knows this client by: SHA-256 over the certificate it paired
            with, in lower case hex, which every renewal keeps. A name is the client's own choice
            and need not be unique, so the KPG tab counts and tells clients apart by this, and each
            row of its Clients page names it.
        admissionKey:
          type: string
          description: |
            SHA-256 over the certificate on this connection, in lower case hex, which a renewal
            changes. The Clients page revokes a certificate by it, and every line of the audit but
            a pairing's, whose program holds no certificate yet, names by it the certificate the
            line is about.
        expires:
          type: string
          description: When the certificate stops being admitted, RFC 3339 in UTC to the second.
        profiles:
          type: array
          items:
            type: string
          description: |
            The profiles the rules are asked about for this client: the ones its admission record
            holds that the database still names, in the record's order.
        removedProfiles:
          type: array
          items:
            type: string
          description: |
            The ones its record holds that the database no longer names. They grant nothing, and
            the operator naming one again gives it back.
        profilesUnreadable:
          type: boolean
          description: |
            Whether the database's list of profiles will not read, which is damage rather than
            anybody's choice. A list that will not read names fewer profiles than it held, none
            at all when it does not parse, so `removedProfiles` then holds names nobody removed,
            and they come back when the list is repaired. False whenever the list reads.

    # One mask per profile because a switch belongs to its rule: `A` and `P` say how far the verbs
    # of the same rule reach, so a client holding `.R......` under one profile and `.....L.P` under
    # another may read the entry and see a protected title in a listing, and is still refused the
    # protected values a read carries. One mask made of both, `.R...L.P`, would claim a read the
    # gate refuses. §511
    Access:
      type: object
      required: [grants]
      additionalProperties: false
      description: |
        A client holding `.R...L.P` under `reader` and `C.....A.` under `uploader` at a node is
        answered `{"grants":{"reader":".R...L.P","uploader":"C.....A."}}` there.
      properties:
        grants:
          type: object
          additionalProperties:
            type: string
            pattern: "^[C.][R.][U.][S.][D.][L.][A.][P.]$"
          description: |
            One member for each profile this client holds, the ones `getIdentity` lists as
            `profiles`, each a mask in the notation the KPG tab shows a rule in: `CRUSDLAP`, with a
            dot for each verb or switch the profile is not granted here, and eight dots for a
            profile granted nothing here. A switch reaches only the verbs of its own mask, so this
            client may read a protected value here when one mask holds both `R` and `P`, and never
            because one mask holds `R` and another `P`; it may add an attachment to this entry
            when one mask holds both `C` and `A`, and an entry to this group when one holds `C`. A
            switch is shown only beside a verb of its own mask that a switch can qualify, so a
            rule granting `A` or `P` beside `S` or `D` alone is answered without it, since
            removing takes attachments and protected values without asking. `D` is the rule saying
            removals are allowed here; removing the node itself asks the group above it as well,
            so it needs a `D` in that group's answer too, from the same profile. The question is
            asked of the node
            alone, as the KPG tab shows a rule there, so `S` is reported on a group though no
            operation strips one: a mask says what the rules grant at the node rather than which
            operations would succeed on it.

    EntryFields:
      type: object
      additionalProperties: false
      description: |
        The five strings every entry has, by KeePass's own names, so that nothing has to map one
        vocabulary onto another and no custom field can collide with a translated one. Every member
        is optional: a create fills in the rest as empty, and an update writes only what is named.
        Each name is matched against the entry's own byte for byte, as `FieldName` explains, and
        against the body's other names as well, for the whole body before any of it is written: a
        name the database could not keep apart from a name the entry carries, or from another name
        in the body, is `409`.

        `expires` is not a string the entry holds, and is spelled as a read answers it, in lower
        case, rather than after either of the two things KeePass keeps for it, `Expires` and
        `ExpiryTime`, which it says in one value.
      properties:
        Title:
          type: string
          maxLength: 512
        UserName:
          type: string
          maxLength: 512
        Password:
          type: string
          maxLength: 65536
        # Stored as written, as every value is. KeePass's Open URL action compiles the entry's URL
        # first, which resolves a field reference such as `{REF:P@I:...}` against the whole open
        # database, knowing nothing about these rules, and replaces `%NAME%` with an environment
        # variable, and it starts a `cmd://` URL as a command line. The entry view makes a link of a
        # web address in the notes, the title, the user name or a custom field as well, and a click
        # opens it the same way, `%NAME%` replaced and nothing asked, though a brace ends such a
        # link, so a reference never travels that way. What that means for an operator granting a
        # write verb is in docs/access-control.md.
        URL:
          type: string
          maxLength: 8192
          description: |
            Stored as written. What KeePass makes of it when the operator opens it, a field
            reference resolved or a command run, is not checked here.
        Notes:
          type: string
          maxLength: 65536
        # One spelling, because a `.kdbx` keeps no fraction of a second and one spelling leaves
        # nothing to guess. `auto` is a create's alone, because an entry that exists already has
        # the expiry somebody decided on. §506
        expires:
          type: string
          maxLength: 20
          description: |
            When the entry expires, as RFC 3339 in UTC to the second, `2031-02-03T04:05:06Z`,
            which is how every moment this API answers with is written, so the `expires` a read
            answers goes back as it came, and no other spelling is read as a moment, an offset or
            a fraction of a second included; empty for an entry that does not expire, which on an
            update takes an expiry off and leaves the moment where KeePass's own dialog leaves it;
            or, on a create only, `auto`, for whatever expiry KeePass's options give every new
            entry, the number of days under Tools, Options, Security. That is none unless the
            operator has switched it on, and none in the entry templates group, whose expiry every
            entry made from a template would copy, where KeePass's own Add Entry applies it nowhere
            either. Absent asks for nothing: the entry a create makes does not expire, and an
            update leaves the expiry as it is. Anything else is `400 malformed`, `auto` on an
            update included.
            This says no more than a length because `BodyCheck` implements neither `format` nor
            `enum`, and the handler holds the member to the rest.

    Group:
      type: object
      required: [uuid, name, notes, parent, created, modified]
      additionalProperties: false
      properties:
        uuid:
          type: string
        name:
          type: string
        notes:
          type: string
        parent:
          type: string
          nullable: true
          description: |
            Null on the root group, which is how a client finds the top of the tree. A group the
            rules hide is named here all the same, as `Unreachable` explains.
        created:
          type: string
        modified:
          type: string

    GroupSummary:
      type: object
      required: [uuid, name, parent, created, modified]
      additionalProperties: false
      description: |
        What `list` says about a group: where it is and what it is called. Its notes are free text,
        which is what `read` is for, so they are on `readGroup` and not here.
      properties:
        uuid:
          type: string
        name:
          type: string
        parent:
          type: string
          nullable: true
          description: |
            Null on the root group, which is how a client finds the top of the tree. A group the
            rules hide is named here all the same, as `Unreachable` explains.
        created:
          type: string
        modified:
          type: string

    GroupList:
      type: object
      required: [groups, count]
      additionalProperties: false
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/GroupSummary"
        count:
          type: integer
          description: |
            How many are in this answer, which is how many the rules allowed. What was left out is
            not counted, because a count of what a client may not see is a description of it.

    EntrySummary:
      type: object
      required: [uuid, group, title, url, created, modified]
      additionalProperties: false
      description: |
        What `list` says about an entry. A title and a URL are what make a listing usable, and
        granting `list` is how an operator says they may be seen. Everything else needs `read`.

        Either can be protected, and then `list` alone is not enough: a protected one comes back
        as `null` without the `protected` switch, the same way the read route answers.
      properties:
        uuid:
          type: string
        group:
          type: string
          description: |
            The group the entry is in, named even where the rules hide it, as `Unreachable`
            explains.
        title:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        created:
          type: string
        modified:
          type: string

    # The router decides the node a listing is anchored at, and the handler leaves out each item
    # the rules do not allow. An entry left out is not an error and gets no audit line of its own,
    # because that is the normal case for a client that may see part of a database.
    EntryList:
      type: object
      required: [entries, count]
      additionalProperties: false
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/EntrySummary"
        count:
          type: integer
          description: |
            How many are in this answer, which is how many the rules allowed. What was left out is
            not counted, because a count of what a client may not see is a description of it.

    Entry:
      type: object
      required: [uuid, group, created, modified, expires, fields, protected]
      additionalProperties: false
      properties:
        uuid:
          type: string
        group:
          type: string
          description: |
            The group the entry is in, named even where the rules hide it, as `Unreachable`
            explains.
        created:
          type: string
        modified:
          type: string
        # Nothing is added to the mask for the expiry: it belongs to the entry as its title does
        # and is not a value the database protects, so neither switch is asked. A listing leaves
        # it out, because `list` gives names.
        expires:
          type: string
          nullable: true
          description: |
            When the entry expires, or `null` when it does not. Once that moment is now or earlier
            the entry has expired, which is how KeePass judges one, and KeePass still shows and
            copies it: an expiry is advice to whoever uses the entry, and what keeps a client from
            one is the rules.
        # A value is never compiled because KeePass resolves a reference against the whole open
        # database, which knows nothing about these rules, so compiling one on the way out would
        # hand a client the value of an entry its rules do not reach, through a field of one they
        # do. A client compiles a value on its own side instead, as `pykeepassgate.refs` does: it
        # follows a reference by identifier with a read of its own, which the rules decide and the
        # audit records like any other, and the placeholders for the entry's own strings out of the
        # entry it holds. It refuses a reference that searches, since a search here sees only what
        # the client may list while KeePass takes the first match in the whole database, and every
        # other placeholder KeePass replaces, from the parts of an entry's URL to a command KeePass
        # would run. §512
        fields:
          type: object
          additionalProperties:
            type: string
            nullable: true
          description: |
            Every string the entry holds, by name, served as it is stored and never compiled: a
            field reference such as `{REF:P@I:...}` and a placeholder such as `{USERNAME}` or
            `%TEMP%` come back as the text they are. A value the caller's rule does not reach is
            `null` rather than absent, so a value being withheld is not the same answer as a field
            that is not there, and an empty one is `""`. `protected` says which of them the
            database protects. A standard field the entry does not carry is left out, which the
            reference client reads as `""`, as KeePass reads a missing standard string. The members
            come in the order KeePass keeps the strings, its collation of their names in the
            culture it runs under, which decides the order it replaces an entry's own placeholders
            in, so a client compiling them keeps it: the order is a promise rather than an
            accident of the writer.
        protected:
          type: array
          items:
            type: string
          description: |
            Which of them the database keeps protected, and so which could have been withheld,
            which is why it is always there.

    Field:
      type: object
      required: [name, value, protected]
      additionalProperties: false
      properties:
        name:
          type: string
        value:
          type: string
          nullable: true
          description: |
            `null` when the field is protected and the caller's rule does not reach secrets. The
            field is still named and still reported as protected, because refusing to say it exists
            would be a different answer from refusing to say what it holds. Otherwise the value as
            it is stored, never compiled, as `Entry` says of its `fields`.
        protected:
          type: boolean

    FieldSummary:
      type: object
      required: [name, protected]
      additionalProperties: false
      properties:
        name:
          type: string
        protected:
          type: boolean

    FieldList:
      type: object
      required: [fields]
      additionalProperties: false
      properties:
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldSummary"

    AttachmentSummary:
      type: object
      required: [name, size]
      additionalProperties: false
      properties:
        name:
          type: string
        size:
          type: integer

    AttachmentList:
      type: object
      required: [attachments]
      additionalProperties: false
      properties:
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentSummary"

    Attachment:
      type: object
      required: [name, size, content]
      additionalProperties: false
      properties:
        name:
          type: string
        size:
          type: integer
        content:
          type: string
          description: The bytes, base64 encoded, because this API answers in JSON and nothing else.

    Made:
      type: object
      required: [uuid]
      additionalProperties: false
      properties:
        uuid:
          type: string
          description: |
            What was created. A field or an attachment answers with its name, which is what
            addresses it.
        etag:
          $ref: "#/components/schemas/WrittenTag"

    Ok:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok:
          type: boolean
        etag:
          $ref: "#/components/schemas/WrittenTag"

    # In the body and not as an `ETag` header, because RFC 9110 section 9.3.4 makes an `ETag` on
    # the answer to a `PUT` say the representation sent was stored as sent, and on a `POST` or a
    # `DELETE` it names nothing the request had, while this is the tag of the whole node.
    WrittenTag:
      type: string
      description: |
        The tag of the node the change left, written as `ETag` writes one, quotes and all, so that
        it goes back as `If-Match` unchanged and a client can write again without reading in
        between: on an update, and on a field or an attachment added or taken off, which is the
        entry's tag. Taken where the change was made, before the save, so it is the tag of exactly
        what was written. Present only for a client the `ETag` header would be sent to; absent on a
        group or an entry removed, since nothing is left to tag, and on a new group or entry,
        since what a create is sent to is a listing, which has no tag, and a client that wants the
        new node's reads it.

  responses:
    # Not now, as against not at all. A lock is not a decision, so the audit records none: a
    # request that met it before the router decided leaves no line, and one that met it afterwards
    # keeps the line its decision got. §502
    Unavailable:
      description: |
        Not now, and worth trying again shortly, where a refusal is not. The body carries
        `locked`, `undecided` or `busy`, and so does `KPG-Unavailable`, for a `head`, and `busy`
        covers everything the password manager is doing that this request cannot be served
        underneath.

        `locked` is the database being locked, answered before a route is chosen at all, by a
        second host certificate held only in memory so that a locked KeePass answers rather than
        failing at the transport. A database that locks or closes while a request is being read,
        before the router has looked up the node it is about, or between the router's decision and
        the handler's read, is `locked` as well, because its nodes have not gone and a client told
        they had would stop looking for something that is still there. A node that has gone while
        the database stays open is the `404` any absent node gets. A write whose handler looks its
        node up before writing, to ask the rules about protected values, meets a lock there as a
        read does, and is `locked` too. The exception is a lock landing once the change is on its
        way: it is handed to the writer, which finds nothing open to change and answers `500
        internal error`, because the change could not be attempted.

        `undecided` is a database holding more than one certificate authority that nobody has
        chosen between, which is copies that each made an authority of their own meeting in a
        synchronize. It is answered before a route is chosen too, with each authority's own host
        certificate, so a client of any of them reaches it, pairing included, and it lasts until the
        operator keeps one of them, which KeePass asks for on its own screen. The clients of the
        authorities not kept are refused from then on and pair again.

        `busy` is five things, and a read meets the first as readily as a write meets the others.
        KeePass's own thread could not be held still for the read: every read waits its turn on that
        thread and holds it for as long as the read takes, so the tree cannot move under it, and a
        turn that does not come round within ten seconds, or a read that outlasts five, is answered
        `busy` rather than trusted. That is KeePass busy with something it does not pause in, such
        as deriving a key, rather than a fault here, or KeePass part way through a merge, which
        no read is started inside: a synchronize, an import and XML Replace leave the tree
        between two databases until they end. A dialog is open on what a write would change,
        and a change made underneath it is a change the operator's OK destroys. KeePass's
        attachment editor destroys it as it closes, writing the attachment back onto the entry it
        came from, and since nothing tells which entry that is, every entry holding an attachment
        of that name is answered `busy` while it is open; a dialog that is
        adding something is answered for where it adds, so a group that Add Entry or the TAN wizard
        will fill on OK is not removed while either is open, and nothing is created in a group whose
        Add Group dialog is still open, since its Cancel takes the group back out with whatever was
        put in it. And nothing at all is written to a database the TAN wizard is open on, since its
        OK adds its entries from inside whatever save is running when it is pressed, and every
        write ends in a save. Another change is already being written, or the user interface did not
        answer in time: a write waits up to 20 seconds for the one ahead of it and up to 30 more for
        KeePass's own thread to take it, which it does once that thread is idle, so `busy` for
        either can take close to a minute to arrive, and a client waiting less gives up on a write
        that may still land. A message box, or any other dialog of Windows' own open in KeePass, is
        answered at once instead, since KeePass's thread takes nothing while one is open. One
        KeePass has started is bounded by its save rather than by these waits, and is answered when
        the save is over, which takes as long as the database's size and its storage make it; for a
        database KeePass opened from a URL the storage is a server, and a save waits on it for as
        long as KeePass's network timeouts allow. And a save that would stop and ask: KeePass
        answers three conditions with a question on the operator's screen rather than by writing,
        which are saving disallowed by policy, a database with no file yet, and a file on disk that
        is not the one KeePass read, and a request from an unattended client must not raise a modal
        box that would hold the connection until somebody answered it. The third is the one a client
        meets in the ordinary course of things, on a database kept on a share or in a synced folder,
        and it clears when the operator lets KeePass reconcile the file, which is why it is a retry
        rather than an error. It is refused as well where KeePass is set to synchronize without
        asking, because that merge would run inside the request and underneath the write, and can
        still stop to ask for the other file's key.

        The fifth is KeePass being part way through something of its own. A write is made and
        saved on KeePass's own thread, and the operations that take it for a while, saving,
        importing, synchronizing, exporting and anything KeePass shows its progress window for,
        XML Replace among them, all pump that thread's queue while they run. A write waits for
        them, since it starts only once that thread is idle, so this is the third reason above
        for one that outlasts the wait, and refused on its own only where one of them shows a
        window the write would land under, until the operation is over.
      # What a write delivered inside one of KeePass's own operations did, while writes were posted
      # to KeePass's thread rather than queued for it, was nothing a client could see as a conflict:
      # the operator's own save committed the copy it took before the change and the write the
      # client was told had landed was gone from the disk, or half an import was written with
      # nothing left to show the rest never was, or an export threw and left a truncated file.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        KPG-Unavailable:
          $ref: "#/components/headers/Unavailable"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Approving:
      description: |
        Not now, as `Unavailable` says, from one of the two operations that wait on the operator,
        and with one thing more. When the operator has approved and KeePass was too busy to write
        what they approved, the approval is held, in the plugin's memory and nowhere else, and
        `heldUntil` says until when, in UTC to the second, as in
        `{"error":"busy","heldUntil":"2026-10-14T09:06:00Z"}`, which is the end of the pairing
        budget the request arrived in: the same request asked again before then, with nothing in
        it different, is written without the dialog, and a pairing's retry starts from a hello as
        every pairing retry does. A request that differs in anything is put to the operator
        again. The approval is used once, by the write that lands, and what it was approved
        against is compared at that write: the authority served, which of the names the answer
        rested on the list holds as the dialog showed it, and for a renewal the record being
        renewed, still there and unrevoked, so a revocation that lands in between is never
        overtaken. An approval that no longer matches is used up and answered `503 busy` with no
        `heldUntil`, nothing is spent, and the next request puts the dialog in front of the
        operator again. A lock and KeePass exiting let go of
        every approval held, and a close of a database lets go of that database's, and then the
        next request raises the dialog again too. And a list of profiles in the database that
        will not read is answered `503 busy` before the operator is asked, since what either
        operation writes is taken from it.
        `heldUntil` is there only while an approval is held; every other `503` here is
        `Unavailable`'s, or the one for a list that will not read.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        KPG-Unavailable:
          $ref: "#/components/headers/Unavailable"
      content:
        application/json:
          schema:
            type: object
            required: [error]
            additionalProperties: false
            properties:
              error:
                type: string
              heldUntil:
                type: string

    Unpaired:
      description: No admission record for this certificate. Also what revocation looks like.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    # The transport serves thirty-two connections at once, so ten times an attachment's size, at
    # once on every one of them, is what the ceiling holds down.
    # An entry's answer costs about four times its strings, on each of the thirty-two
    # connections the transport serves at once, so its strings are held down as an attachment is.
    EntryTooLarge:
      description: |
        The entry's strings, names and values together, come to more than this gate hands out or
        keeps: 524288 characters, half a million. A read of an entry over it, which KeePass or a
        merge can make, is refused before anything is decrypted, and so is a read of one field
        over it with its name; a write that would take the entry over it is refused with nothing
        changed. The same number for both, so that what this gate lets a client write it also
        hands back. Stripping a field is never refused for it, which is how an entry over it is
        brought back under. The body names the size and the ceiling in a sentence rather than a
        word, so a client knows this refusal by its status.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    TooLarge:
      description: |
        The attachment is larger than this gate will hand out. Building one costs about ten times
        its size in memory inside the password manager's own process, so there is a ceiling, and it
        is the same size a write accepts: what this gate gives out it can also be given back. The
        refusal comes before anything is decrypted. The body names the size and the ceiling in a
        sentence rather than a word, so a client knows this refusal by its status.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    # KeePass writes every unprotected string into its XML through a method that silently removes
    # what XML 1.0 cannot represent, and its reader drops an element's text when it is only
    # whitespace. Such a string was accepted, answered `200` or `201` and read back short, or with
    # no name at all, which on a password is the difference between a client believing it rotated
    # a credential and its not having done so.
    Malformed:
      description: |
        The body, or the value of a query parameter, is not what the document declares, or it is
        and carries a string a `.kdbx` cannot hold, on every operation and in the name of a field
        or an attachment as much as in a value: a string holding a control character other than
        tab, carriage return and line feed, or `U+FFFE` or `U+FFFF`, and a string of whitespace and
        nothing else. A surrogate half never arrives here, as the description at the top explains.
        Each of these is answered `{"error":"malformed"}`, the same word whichever it was, so a
        client is told that the request was refused and not which part of it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    # Not the `404` a refusal gives, because answering `not saved` that way told a client its
    # request had nowhere to go while the database held the change, and a retry made a second one.
    Internal:
      description: |
        The gate failed, rather than the request being wrong or the node being out of reach. Three
        things reach this. `not saved` means the change was made and the save never got to the
        disk, and it has been taken back out again. `internal error` means it could not be
        attempted at all: the database closed under the request, or KeePass answered the attempt
        with an error. Neither leaves anything behind that a retry would duplicate, which is why
        this is not the `404` a refusal gives: that answer says the request had nowhere to go, and
        it is the one an absent node and a forbidden one share. Neither is worth retrying either,
        for the same reason. `not verified` is the third and the one that does leave something
        behind: the change was made and saved, and the file KeePass hashed back afterwards is not
        the one it wrote, so nothing knows whether the file holds the change and it is not taken
        back out. So is a change whose database KeePass closed as its save ended, which a lock can
        do, leaving nothing to hash the file against. A retry may make a second copy, and what to do
        about it is the operator's, whom KeePass has warned when writing failed. A pairing in the
        same situation is refused instead, because a record that may not be on the disk is a
        certificate nobody can see and nobody can revoke.

        Every operation whose verb changes the database declares this, and one that does not stops
        the plugin loading.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    # Declared by every operation with a body because the refusal is decided from the document's
    # own media type rather than from anything an operation says.
    UnsupportedMediaType:
      description: |
        The body was sent under a media type this API does not speak. `application/json` is the
        only media type it declares anywhere, and a body declared under another beside it stops the
        plugin loading. A request claiming no type at all is taken as claiming `application/json`,
        because a caller that claimed nothing has not claimed something else. Every
        operation carrying a body declares this, and one that does not stops the plugin loading. A
        body sent to an operation that declares none is refused before its type is looked at, as a
        target this document does not declare.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    PairingRefused:
      description: |
        Either the proof did not verify, in which case the invitation is not spent, or this
        connection may not pair at all and is being told what every caller without a certificate is
        told on every path there is. `proof` is the first and `unpaired` the second, and they are
        not told apart on purpose: a caller the database does not admit cannot tell a pairing route
        from a path nobody declared.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NoInvitation:
      description: |
        One of two, and the body names which. `no invitation` is the invitation gone, expired or
        spent, and pairing again needs a new invitation from the operator. `no exchange`, which
        only `pairRequest` answers, is a request that did not follow its own hello: there was no
        hello, or a different certificate answered it. That spends the hello's challenge and
        nothing else, so the same invitation starts again from a hello.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    # Both pairing routes declare this and the `401`, so a client can tell either from a routing
    # mistake.
    NotPairing:
      description: |
        This connection may not pair: it arrived on no invitation, or it already holds a
        certificate. Only a client the database already admits is told this much, and it is told
        exactly what an undeclared path tells it. Everybody else gets the `401` above instead.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    # One answer for absent and refused, and for a node gone under a request, which is never
    # answered as empty. §503
    Unreachable:
      description: |
        There is nothing there, or nothing the rules let this client reach. **The same answer to
        both, deliberately.** Telling them apart would let a client that may reach nothing map the
        database by asking, one identifier at a time, which is exactly what `list` exists to be able
        to withhold. The operator is told which it was, in the audit.

        **A group the rules hide is still named by what is in it.** What a client may see carries
        the identifier of the group it is in, as `parent` on a group and `group` on an entry,
        whether or not the client may reach that group, and asking for that group by it is then
        this answer. So a client shown something inside a group it may not reach learns that the
        group is there and which of what it is shown share it, though never the group's name, its
        notes or anything else in it. The identifier is served all the same because it is how a
        client places what it is shown, and a `parent` of null already stands for the root.

        A node that goes while the request is answered, in a database that stays open, is this as
        well, and so is a listing of a group or an entry that has gone: never `200` with an empty
        list, which would say the node is there and holds nothing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    PreconditionFailed:
      description: |
        The node is there and no longer holds what `If-Match` said, so nothing was read or changed:
        `{"error":"precondition failed"}`. Another client, the operator in KeePass, a merge or a
        plugin changed it after the tag was taken. Not retried, because asking again asks the same
        question of the same node; what mends it is reading the node again, which hands back the
        tag it holds now, and deciding again whether the change still makes sense. An `If-Match`
        that cannot be read at all is answered this way too, because every way of ignoring it ends
        with the write going ahead, and so is any `If-Match` from a client the `ETag` header is not
        sent to, whose rule does not read everything the tag covers: reading again hands such a
        client no tag, and what mends it is sending none.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    # A taken name is told rather than hidden because a create that did not land has to tell the
    # client so, or a client that only adds believes it stored what it did not, and neither other
    # answer is open: a `404` would call an entry it may add to absent, and writing over the name
    # is what `update` is for. A group that still holds something is told for the same reason: a
    # removal that did not happen has to be refused as such, and a `404` would call absent a group
    # the client may remove.
    Conflict:
      description: |
        The database already says otherwise: a name that is taken, a name the database cannot
        tell from one it already holds, such as a standard field's name held under another
        spelling by a file another program wrote, a group that still holds something, or a
        standard field, which is emptied rather than taken off.

        **A taken name is `409` even to a client that may create and not list**, and that tells it
        the name is there. What it learns is a name, one guess at a time, and never a value.

        **So is a group that still holds something, to a client that may remove it and not list
        it**, and that tells it the group is not empty, since an empty group is removed. What it
        learns is that something is there, never what.

        **Not the root group**, which `deleteGroup` answers `404` for, as it does for any node
        the rules do not reach. A removal is asked of the group a node is leaving and the root is
        leaving nothing, so the question is refused before it reaches a handler that could call
        it a conflict, and a client that asked cannot tell the root from a group it may not have.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Done:
      description: |
        The change is made and the database saved before this was answered. An update that asks
        for nothing the node does not already hold makes no change and saves nothing, and is
        answered the same, as the description at the top explains.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Ok"

    Made:
      description: |
        Created, and saved before this was answered. What comes back is what addresses it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Made"

  headers:
    RetryAfter:
      description: |
        How long to wait before asking again, in seconds: `2`, on every `503` this gate sends,
        whichever of them it is, and on nothing else it sends. RFC 9110 section 10.2.3. Which
        refusal it was is the body's job, and a client that treats them differently reads that;
        the delay is a guess either way, because how long any of these lasts is a person's
        business rather than this gate's, and two guesses would only invite reading meaning into
        the difference.
      required: true
      schema:
        type: integer

    Unavailable:
      description: |
        Which refusal this is, the word the body's `error` names: `locked`, `undecided` or
        `busy`, on every `503` this gate sends and on nothing else. Here as well as in the body
        for the answer to a `head`, which carries no body, so that a client asking whether
        something is there tells `busy` from `locked` and waits each out as it would for a
        `get`. RFC 9110 section 9.3.2 asks a `head` for the header fields a `get` would
        answer with, so a `get` carries it too.
      required: true
      schema:
        type: string

    ETag:
      description: |
        What the group or the entry holds, condensed into 32 hexadecimal digits in quotes, a strong
        tag as RFC 9110 section 8.8.3 spells one: `"3f9c0e7a1b2d4c5e6f708192a3b4c5d6"`. It is
        opaque, and a client compares it, keeps it and hands it back rather than reading anything
        into it. An entry has one tag for itself and everything in it, so the entry, its fields,
        one field, its attachments and one attachment all answer with the same tag, as the rules
        answer for all of them by the entry; a group's tag is its own.

        **What it covers is what these routes serve, as they serve it, and nothing more**: for an
        entry its identifier, the group it is in, when it was created and last changed, every
        string with its name, whether it is protected and its value, every attachment with its
        name, its size and, up to the largest this gate hands out, its bytes, and when it expires;
        for a group its identifier, the group it is in, its two times, its name and its notes. The
        identifier keeps two nodes that hold the same from sharing a tag, which would tell a client
        so. Any change to one of those, made here, in KeePass, by a merge or by another plugin, is
        a new tag. A time enters to the second, as it is served, which is all a database opened
        again keeps of it. A rule is not in it, since no route serves one.

        **Sent only to a client that may read everything it covers**: `read` on a group, and on an
        entry `read` reaching its attachments, and its protected values too when it holds any, in
        one rule. A tag is a digest of the content, and one handed to a client that may not read
        all of it would let that client test guesses at the rest by writing them where it may
        write. A client that is not sent one has any `If-Match` it sends answered `412`, since a
        condition it cannot be told the answer to is one it cannot meet.

        **And it says nothing about what it was made from.** It is keyed with a secret derived from
        the database's own host key, which no client holds, so nothing outside the gate can compute
        a tag for a guess. One content gives one tag for as long as the database's authority
        stands, across a lock, a restart and a reload, and recreating the authority changes every
        tag. A listing of groups or entries carries none, since it answers about a collection,
        while a listing of an entry's fields or attachments carries the entry's.
      required: false
      schema:
        type: string

  parameters:
    # On the six paths whose target has a tag, which is every operation about one group or one
    # entry and about an entry's fields and attachments, reads among them. The one header parameter
    # this document may declare: the router reads `Content-Type` as well, which is declared as a
    # body's media type rather than as a parameter. The plugin refuses to load a document declaring
    # another header, this one required or with a schema beyond a bare string, or this one on an
    # operation that does not answer 412.
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        Do this only if the node still holds what one of these tags says, as RFC 9110 section
        13.1.1 has it: one tag or several on the line, comma separated, each in quotes as `ETag`
        hands it out, or `*` for whatever the node holds. The tag is the group's for a group and the
        entry's for the entry and everything in it, so a field written against a tag taken from the
        entry's own read is refused if anything in the entry changed since, not only that field.
        Compared strongly, so a weak tag never matches. Absent, nothing is asked and the request is
        served as it always was: a write goes ahead whatever changed since the caller last read.

        **Answered `412`, and the node left as it was**, when it does not hold what was asked, when
        the field cannot be read, an empty one included, and when this client is not one the
        `ETag` header is sent to, since a tag it was never given is not one it can name. A node that
        is not there, or that the rules do not reach, is the `404` it always is, whatever was
        asked, and so is every other refusal that does not depend on the tag: a name taken or a
        group that still holds something is `409`, and a dialog open on the node `503 busy`, as RFC
        9110 section 13.2.1 orders them. The header sent twice is `400`, as any header this gate
        reads is.

        **So a client that is sent no tag can learn from an `If-Match` which names an entry
        carries**, without changing anything: a field or an attachment name the entry does not
        carry is `404`, and a name it does carry `412`. A write without the condition tells it as
        much, by making the change wherever the name is there. What it learns is a name, one guess
        at a time, and never a value.

        **A write's condition is checked where the write is made**, on KeePass's thread under the
        writer's lock, against the node as the change would find it, so nothing can land between
        the check and the change. A read's is checked against the tag the read is answered with.
      schema:
        type: string

    # The alias is not a route of its own, since no identifier can be spelled `root`, and it is
    # there because no verb implies another: an identifier can as easily come from an operator
    # pasting it into an agent's configuration as from a listing.
    GroupUuid:
      name: uuid
      in: path
      required: true
      description: |
        A group's identifier, 32 hex characters, or the word `root` for the group every database
        has. The alias exists so that a client granted only `create` can put something somewhere
        without first being granted `list` to find out where.
      schema:
        type: string
        minLength: 4
        maxLength: 32

    EntryUuid:
      name: uuid
      in: path
      required: true
      description: An entry's identifier, 32 hex characters.
      schema:
        type: string
        minLength: 32
        maxLength: 32

    # KeePass keeps an entry's strings and its attachments in dictionaries that compare names the
    # way the current culture sorts them, and that collation gives `U+00AD`, `U+200D`, `U+2060` and
    # `U+FEFF` no weight at all and reads a composed character and its decomposed spelling as one.
    # `Pass<U+00AD>word` therefore addressed the entry's `Password`, while the guards above the
    # store compared byte for byte and judged it a custom field, and it was applied to the
    # credential.
    FieldName:
      name: name
      in: path
      required: true
      description: |
        The name of one of an entry's strings, as KeePass names them: `Title`, `UserName`,
        `Password`, `URL`, `Notes`, or whatever a custom one is called. Percent encoded, and a
        separator inside it has to be escaped. **A name that decodes to `.`, `..` or a control
        character cannot be addressed by a path**: the transport refuses such a target with `400`
        before a route is chosen, as the description at the top explains. Nor can a name that
        decodes into a climb, such as `a%2F..%2Fb` for `a/../b`, which the transport lets through
        and no route matches, so it is answered as an undeclared path is. The entry's own read
        carries every string it holds, such a name included.

        A name is matched against the entry's own names byte for byte, and a name not among them is
        a name the entry does not carry, which is `404`, even where the database could not keep it
        apart from a name the entry does carry. That is `409` only for a name a body brings, as
        `createField`, `createAttachment` and `EntryFields` state.
      schema:
        type: string
        minLength: 1
        maxLength: 512

    AttachmentName:
      name: name
      in: path
      required: true
      description: |
        An attachment's name, percent encoded. **A name that decodes to `.`, `..` or a control
        character cannot be addressed by a path**: the transport refuses such a target with `400`
        before a route is chosen, as the description at the top explains, and a name that decodes
        into a climb matches no route, as `FieldName` explains. The entry's listing still names it.
        A name is matched as a field's is, which `FieldName` sets out.
      schema:
        type: string
        minLength: 1
        maxLength: 512

    IncludeExpired:
      name: includeExpired
      in: query
      required: false
      description: |
        `false` leaves out every entry that has expired, which is one that expires at a moment
        that is now or earlier on the gate's clock, as KeePass judges one. `true`, and leaving it
        out, lists them with the rest, as KeePass's own list does, so a caller that has never
        heard of expiry sees the database it always saw. Anything else is
        `400 malformed`, because a caller that meant to leave them out and misspelled the word
        must not be handed them. It is answered with `list`, so a caller that may list an entry
        can learn by asking twice whether it has expired, which KeePass's list shows by striking
        it through; when it expires is what `read` gives.
      schema:
        type: string
