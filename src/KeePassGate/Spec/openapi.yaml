openapi: 3.0.3

info:
  title: KeePassGate
  version: 0.1.0
  description: |
    The routing table, not a description of one. This document ships embedded in the plugin and is
    read at startup: an operation with no handler, or a handler with no operation, stops the plugin
    loading rather than becoming a 404 somebody finds later. A path that is not declared here has
    nowhere to go.

    **Every `get` declares a `head` beside it, and the two share one handler.** RFC 9110 section
    9.3.2 says a `head` is identical to its `get` except that no content is sent, so one handler is
    what makes that true by construction rather than by two implementations agreeing. The plugin
    refuses to load a `get` with no `head`, and a pair that disagrees about its `x-kpg-verb`,
    its `x-kpg-attachments`, needing a certificate, or carrying a body. The answer omits
    `Content-Length` rather than sending a wrong one, which section 9.3.2 permits for a value
    determined only while generating content, and section 8.6 requires of anything else.

    **A declared path asked for with a method it does not declare answers `405`, carrying the
    methods it does.** RFC 9110 section 15.5.6 requires that list, and it is read off this
    document rather than written anywhere, so it cannot fall out of step with what the server
    routes. It is not declared per operation, because no operation answers it: a `405` is what
    is said when none of the operations on a path matched, which is a property of the path
    rather than of anything listed under it.

    `x-kpg-unauthenticated` marks the two routes an invitee may reach before it has a certificate.
    Everything else needs one, by default rather than by remembering to say so.

    `x-kpg-verb` says what an operation does to the database: `create`, `read`, `update`, `strip`,
    `delete`, `list`, or `none` for an operation no grant governs. **Every operation declares one**,
    and one that does not stops the plugin loading, so authorization is not something a new route
    can be added without. `none` is the status route, which reads nothing, and the two pairing
    routes, which a person authorizes by reading a dialog rather than a grant. `list` is below
    `read`, because knowing that an entry exists is not knowing what is in it.

    `strip` and `delete` are two sizes of removal. `strip` takes the parts off a node, which are an
    entry's fields and its attachments. `delete` says removals are allowed here. TODO(step 14):
    an operation declaring `delete` is to be asked twice, of the group the node is leaving and of
    the node itself, because a removal is a move. Nothing above the root allows its removal, so
    the root cannot be removed. The resolver answers about one node, so that second question is
    asked by whatever calls it, and nothing calls it yet.

    `x-kpg-attachments: true` marks an operation that reaches the attachments inside an entry rather
    than only its fields. Such an operation needs both the verb and the attachment switch from the
    same rule, except where that verb is a removal: removing shows nobody anything, and a rule that
    may remove an entry already takes everything inside it. It is a second declaration rather than a
    seventh verb because no operation does attachments: one reads or replaces or removes, and what
    it reaches is a separate question. Absent means fields only, which is the same default deny as
    everything else here.

    **Protected values are a scope too, and no operation declares it.** A password does not have a
    route of its own: it arrives inside the answer to a read that is already allowed, so the switch
    is answered while that answer is written rather than before dispatch. A caller whose rule does
    not carry `protected` is told everything else about the entry and gets `null` where a protected
    value would be, and `protected` says which those were.

servers:
  - url: https://127.0.0.1:{port}
    description: |
      Loopback only, and reaching it from elsewhere is a tunnel's job.

      **The address is where a connection is made and not what it is made to.** Every connection
      is resolved by the name in its ClientHello, which is one name per connection, computed from
      the gate key this client was given when it paired. No TLS client sends a name for an IP
      literal, so a client that offers this address alone offers no name, and a connection with no
      name is dropped without a byte back. The host certificate is issued for that name rather than
      for the address, so a client pins the authority instead of matching a host.
    variables:
      port:
        default: "51776"
        description: Chosen at startup, or set with KEEPASSGATE_PORT.

paths:
  /gate/status:
    get:
      operationId: getStatus
      summary: Whether the gate is serving, and which database this client reached.
      description: |
        Reads nothing out of the database. It exists to prove a connection: that the gate is
        listening, that this certificate is still admitted, and that the database is unlocked.
      x-kpg-verb: none
      responses:
        "200":
          description: Serving.
          content:
            application/json:
              schema:
                type: object
                required: [ok, database, version]
                additionalProperties: false
                properties:
                  ok:
                    type: boolean
                  database:
                    type: string
                    description: |
                      The first characters of the authority's digest, which is what names a database
                      without naming it.
                  version:
                    type: string
        "401":
          $ref: "#/components/responses/Unpaired"
        "503":
          $ref: "#/components/responses/Unavailable"

    head:
      operationId: headStatus
      summary: The same, without the content.
      description: |
        Runs the operation `get` runs, on the same handler, and answers without its content.
        Declared rather than derived so that this document is the whole account of what the API
        answers, and bound to the same handler so that the two cannot come to disagree about
        whether something is there. It declares the same `x-kpg-verb` as the `get` for the same
        reason: a `head` that were governed differently would answer whether a node exists to a
        caller the `get` would have refused.
      x-kpg-verb: none
      responses:
        "200":
          description: The gate is serving this database, and it is unlocked.
        "401":
          $ref: "#/components/responses/Unpaired"
        "503":
          $ref: "#/components/responses/Unavailable"

  /pair/hello:
    post:
      operationId: pairHello
      summary: Prove the invitation, and be proved to in return.
      description: |
        The client speaks first, so a captured name replayed at the gate is refused here rather than
        in front of the operator. The answer carries the gate's own proof, which is the only thing a
        client with no trust anchor has to go on.
      x-kpg-unauthenticated: true
      x-kpg-verb: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proof]
              additionalProperties: false
              properties:
                proof:
                  type: string
                  maxLength: 64
                  description: |
                    Base64 of HMAC-SHA256 under the invitation, over the channel binding and the
                    nonce.
      responses:
        "200":
          description: Proved. The challenge carries the exchange to the second connection.
          content:
            application/json:
              schema:
                type: object
                required: [challenge, proof, expires]
                additionalProperties: false
                properties:
                  challenge:
                    type: string
                  proof:
                    type: string
                  expires:
                    type: string
        "400":
          $ref: "#/components/responses/Malformed"
        "401":
          $ref: "#/components/responses/PairingRefused"
        "404":
          $ref: "#/components/responses/NotPairing"
        "409":
          $ref: "#/components/responses/NoInvitation"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/Unavailable"

  /pair/request:
    post:
      operationId: pairRequest
      summary: Ask to be admitted, and wait for the operator.
      description: |
        Slow on purpose: a human reads a dialog. What comes back says what was approved, which is
        not always what was asked for. The record is written and saved before the certificate is
        handed over, so a certificate the database has no record of is never issued.
      x-kpg-unauthenticated: true
      x-kpg-verb: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, profiles, proof]
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: |
                    What this client should be called. Letters, digits, space, dot, dash and
                    underscore, neither beginning nor ending with a space, which the certificate's
                    subject name would lose.
                profiles:
                  type: array
                  maxItems: 32
                  items:
                    type: string
                    minLength: 1
                    maxLength: 64
                  description: |
                    A ceiling asked for, not a grant. The operator may take any of them away.
                proof:
                  type: string
                  maxLength: 64
      responses:
        "200":
          description: |
            Admitted. The bundle is the client's identity, the authority to pin, and the gate key.
          content:
            application/json:
              schema:
                type: object
                required:
                  [identity, authority, gateKey, subject, database, expires, profiles]
                additionalProperties: false
                properties:
                  identity:
                    type: string
                  authority:
                    type: string
                  gateKey:
                    type: string
                  subject:
                    type: string
                  database:
                    type: string
                  expires:
                    type: string
                  profiles:
                    type: array
                    items:
                      type: string
        "400":
          description: |
            A request that could never have been issued as asked, answered before anything is
            spent, and the body names which of three it was. `malformed` is a body that is not what
            this declares. `name` is a name its description does not allow, and `profile` a
            profile name that could not travel as a claim.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/PairingRefused"
        "403":
          description: The operator refused, and the invitation is spent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotPairing"
        "409":
          $ref: "#/components/responses/NoInvitation"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          description: |
            One of four, and the body names which. `not recorded`: the record did not land, so
            nothing was handed over and the invitation is spent. `expired authority`: this
            database's authority has expired, which is refused before anybody is asked and spends
            nothing. `expired host`: the host certificate this database answers with has expired,
            so no client paired now could connect, refused the same way. `internal error`: the
            operator approved and no certificate could be issued, because the authority ran out
            while the dialog was open or its key would not sign; the invitation is not spent, and
            the client starts again from a hello.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          description: Nobody answered. The invitation is not spent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          description: |
            A fixed string, matched whole rather than parsed. The two worth matching on are one word
            each, `locked` and `proof`, because each is a different thing for a client to do next;
            the rest are told apart by the status and read by a person. None of them carries anything
            the caller sent back to it.

  responses:
    Unavailable:
      description: |
        Not now. Either the database is locked, or a dialog is open on what this would change and a
        change made underneath one is a change the operator's OK destroys. The body says which, and
        the second is worth trying again shortly.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unpaired:
      description: No admission record for this certificate. Also what revocation looks like.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Malformed:
      description: The body is not what the document declares.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    UnsupportedMediaType:
      description: |
        The body was sent under a media type this API does not speak. `application/json` is the
        only one it declares anywhere, and a request claiming no type at all is taken as claiming
        that one, because a caller that claimed nothing has not claimed something else. Every
        operation carrying a body declares this, and one that does not stops the plugin loading.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    PairingRefused:
      description: |
        Either the proof did not verify, in which case nothing is spent, or this connection may not
        pair at all and is being told what every caller without a certificate is told on every path
        there is. `proof` is the first and `unpaired` the second, and they are not told apart on
        purpose: a caller the database does not admit cannot tell a pairing route from a path
        nobody declared.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotPairing:
      description: |
        This connection may not pair: it arrived on no invitation, or it already holds a certificate.
        Only a client the database already admits is told this much, and it is told exactly what an
        undeclared path tells it. Everybody else gets the `401` above instead.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NoInvitation:
      description: |
        The invitation is gone: expired, spent, or this did not follow its own hello.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
