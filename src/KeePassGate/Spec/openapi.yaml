openapi: 3.0.3

info:
  title: KeePassGate
  version: 0.1.0
  # The paragraph on what a write's answer promises. A read is not locked against the writer, for
  # the reason DESIGN.md §119 gives: that lock waits on the user interface thread's save. §501
  #
  # The paragraph on an update that asks for nothing. Refusing `{}` would be the plugin disagreeing
  # with its own schema, and writing anyway took a history revision, moved the modification time
  # and usage count and saved the database, so `update` alone pushed an entry's real revisions out
  # of its history at `HistoryMaxItems` calls that each asked for nothing, and an agent writing
  # back what it had just read, to make sure of it, did the same. A program that may write can
  # still push them out by changing the entry, which docs/access-control.md tells the operator. §504
  #
  # The paragraph on a query name or a body nothing declares. The transport parsed a query and
  # nothing read it, so `GET /entries?group=x` was served as `GET /entries`, handing the whole
  # database to a caller that had asked for part of it, and a `DELETE` carrying
  # `{"recursive":"true"}` was a plain delete, each with nothing said about the words that went
  # unread. A name sent twice is refused because the first name declared would have inherited
  # it. §507
  #
  # The paragraph on protected values. A refused write to one is the `404` an absent field gets,
  # because a refusal that reads differently from an absence is a way to map what is there. §508
  description: |
    The routing table, not a description of one. This document ships embedded in the plugin and is
    read at startup: an operation with no handler, or a handler with no operation, stops the plugin
    loading rather than becoming a 404 somebody finds later. A path that is not declared here has
    nowhere to go.

    **Every `get` declares a `head` beside it, and the two share one handler.** RFC 9110 section
    9.3.2 says a `head` is identical to its `get` except that no content is sent, so one handler is
    what makes that true by construction rather than by two implementations agreeing. The plugin
    refuses to load a `get` with no `head`, and a pair that disagrees about its `x-kpg-verb`,
    its `x-kpg-attachments`, needing a certificate, carrying a body, or the query parameters it
    takes. The answer omits `Content-Length` rather than sending a wrong one, which section 9.3.2
    permits for a value determined only while generating content, and section 8.6 requires of
    anything else.

    **A declared path asked for with a method it does not declare answers `405`, carrying the
    methods it does.** RFC 9110 section 15.5.6 requires that list, and it is read off this
    document rather than written anywhere, so it cannot fall out of step with what the server
    routes. It is not declared per operation, because no operation answers it: a `405` is what
    is said when none of the operations on a path matched, which is a property of the path
    rather than of anything listed under it. It is about the path and never the query: a query
    name nothing on the path declares makes a target this document does not declare at any
    method, answered as an undeclared path whichever method asked.

    **The transport answers before any route is chosen, on any path**, and so none of what it
    answers is declared per operation either, for the reason `405` is not. Each carries the
    `Error` body, its `error` a sentence rather than one word: `400` for a request line, a
    header, a `Content-Length`, a target or a body it cannot read, among them a header repeated
    or folded, a body that ended early or is not UTF-8, and a path segment that decodes to `.` or
    `..`, to a control character, or to bytes that are not UTF-8; `411` for a body with no
    length; `413` for a body over the ceiling; `414` for a target too long; `417` for an
    expectation it does not meet; `431` for a head over its ceiling; `501` for a method it does
    not implement; and `505` for an HTTP version other than 1.1. Nor is the `500 internal error`
    declared that a read would give if the vault behind it broke its own contract, which nothing
    here does: it shares a status with `500 not saved` and not its meaning, which is why the
    body says which.

    **A field or an attachment is named within its entry, percent encoded, separator included**:
    the gate splits a path into segments before it decodes each one, which is what makes an
    attachment called `a/b` addressable at all. A character RFC 3986 says to escape, such as `|`,
    `#` or `{`, has to arrive escaped, and a target carrying one bare is `400`, as RFC 9112
    section 3 asks of a request line the grammar makes invalid. Each segment is held to the
    lengths its parameter declares before anything is looked up, so an entry's identifier that is
    not 32 characters, a group's shorter than `root` or longer than 32, or a name over 512, makes
    a path this document does not declare, answered as one.

    **A request target is more than its path, so a query name this document does not declare
    makes a target it does not declare either**, answered exactly as an undeclared path is: `404
    no such route` for a client the database admitted, and the same `401 unpaired` everybody
    else gets on every path there is. A name sent twice is refused before any of that, with
    `400`, for the reason a repeated header is: which of two values was meant is a guess. A body
    is the other half of that. A `get`, a `head` and a `delete` declare none, and one sent with
    them makes a request this document does not declare, answered as an undeclared path is,
    whatever its media type.

    **A carriage return is stored, and comes back as a line feed.** That is KeePass's behavior
    rather than this API's: the file is XML, and an XML reader turns a carriage return, or a
    carriage return and line feed together, into one line feed when it reads the text back, as
    section 2.11 of XML 1.0 requires. So a value written with `\r\n` or a lone `\r` is answered
    `200` or `201`, is exactly what was sent for as long as the database stays open, and reads
    back with `\n` once KeePass has opened the file again. Tabs and line feeds survive unchanged.
    A client that compares what it wrote with what it reads compares line endings as equal, and
    one that needs the carriage returns kept encodes them itself. A surrogate half written as an
    escape is the one string `Malformed` does not reach: the JSON reader replaces it with
    `U+FFFD` before anything here sees it, which is what a caller asking to store half a
    character gets everywhere else too.

    `x-kpg-unauthenticated` marks the two routes an invitee may reach before it has a certificate.
    Everything else needs one, by default rather than by remembering to say so.

    `x-kpg-verb` says what an operation does to the database: `create`, `read`, `update`, `strip`,
    `delete`, `list`, `any` for an operation asking what the caller may do at a node, or `none`
    for an operation no grant governs. **Every operation declares one**, and one that does not
    stops the plugin loading, so authorization is not something a new route can be added
    without. `none` is the status route and the caller's identity, which read nothing a rule is
    about, the revocation of a client's own certificate, which touches no group or entry a rule
    is about, and the two pairing routes and the renewal, which a person authorizes by reading a
    dialog rather than a grant. `any` is answered by asking the rules about every verb and switch,
    one profile at a time, and refused unless one of them is granted a verb at the node.
    `list` is below `read`, because knowing that an entry exists is not knowing what is in it.

    `strip` and `delete` are two sizes of removal. `strip` takes the parts off a node, which are an
    entry's fields and its attachments. `delete` says removals are allowed here, and an operation
    declaring it is asked twice, of the group the node is leaving and of the node itself, because a
    removal is a move, so a group granting `delete` has removable contents while itself standing,
    and a node whose own rule does not grant it is held back from a rule that frees its siblings.
    The resolver answers about one node, so the second question is asked by `AccessCheck`, which
    is also where the root's own case falls out: nothing is above it to allow its removal, so the
    root cannot be removed.

    `x-kpg-attachments: true` marks an operation that reaches the attachments inside an entry rather
    than only its fields. Such an operation needs both the verb and the attachment switch from the
    same rule, except where that verb is a removal: removing shows nobody anything, and a rule that
    may remove an entry already takes everything inside it. It is a second declaration rather than a
    seventh verb because no operation does attachments: one reads or replaces or removes, and what
    it reaches is a separate question. Absent means fields only, which is the same default deny as
    everything else here. A removal skips the protected switch for the same reason, so `strip`
    takes a protected field off without it.

    **Protected values are a scope too, and no operation declares it.** A password does not have a
    route of its own: it arrives inside the answer to a read that is already allowed, so the switch
    is answered while that answer is written rather than before dispatch. A caller whose rule does
    not carry `protected` is told everything else about the entry and gets `null` where a protected
    value would be, and `protected` says which those were. A value is protected when the
    database protects its name, which is KeePass's own `MemoryProtection` setting, or when the
    string itself is marked so. Writing one needs `protected` too, through either operation:
    `updateEntry` naming a protected field and `updateField` on one are the same act and are
    refused the same way, as the `404` of `Unreachable`.

    **A write is answered once KeePass has saved it**, and two things follow from that a client
    can see. A read sees a change before its save lands: reads take no lock against the writer, so
    another connection is answered from the tree the change is already in while the save runs, and
    a save that fails takes the change back out. A client that listed or read the node in between
    holds an identifier, and perhaps values, that are answered `404` afterwards like anything else
    not there; nothing it was handed was outside its rules, and it is what it would have read had
    the save landed. And a change leaves a revision behind, exactly as an edit in KeePass does:
    every operation that alters an entry takes a backup of it first, so a password overwritten
    here is in that entry's history, where the operator restores it from KeePass. Creating an
    entry leaves none, because there is nothing yet to keep, and removing one leaves none either,
    because the recycle bin keeps the whole entry. How many revisions survive is
    `HistoryMaxItems` and `HistoryMaxSize`, which the operator sets in KeePass for their own edits
    and the gate's alike. No operation reads history, writes it, or clears it.

    **An update that asks for nothing writes nothing**, on all four update operations: an
    entry's, a field's, an attachment's and a group's. Every member of an update body is
    optional, so `{}` is a body this document allows, and it asks for nothing; so does a body
    naming only what the node already holds, and the expiry when it names one. The values are
    compared as KeePass compares its own, a string by its text and an attachment by its bytes, and
    not by whether either is protected, which is not something a request names, and a name the
    entry does not carry is a change, since writing it adds a string. Such a request is checked
    as any update is, so a dialog open on the node still makes it `503 busy`, and then it writes
    nothing: no modification time, no usage count, no history revision, no save, and the same
    `200`, because the node holds what the request asked it to hold. The comparison is made on
    KeePass's thread under the writer's lock, where the change itself would be made, so a write
    landing in between cannot make the answer wrong.

servers:
  - url: https://127.0.0.1:{port}
    description: |
      Loopback only, and reaching it from elsewhere is a tunnel's job.

      **The address is where a connection is made and not what it is made to.** Every connection
      is resolved by the name in its ClientHello, which is one name per connection, computed from
      the gate key this client was given when it paired. No TLS client sends a name for an IP
      literal, so a client that offers this address alone offers no name, and a connection with no
      name is dropped without a byte back. The host certificate is issued for that name rather than
      for the address, so a client pins the authority instead of matching a host.
    variables:
      port:
        default: "51776"
        description: |
          The port the operator set on the plugin's window under KeePass's Tools menu, taken when
          KeePass starts. `KEEPASSGATE_PORT` is read only when no port is set there, and has to
          name one from 1024 to 65535: set to anything else, it stops the gate from listening at
          all. This default is taken only when neither names a port.

paths:
  /gate/status:
    get:
      operationId: getStatus
      summary: Whether the gate is serving, and which database this client reached.
      description: |
        Reads nothing out of the database. It exists to prove a connection: that the gate is
        listening, that this certificate is still admitted, and that the database is unlocked.
      x-kpg-verb: none
      responses:
        "200":
          description: Serving.
          content:
            application/json:
              schema:
                type: object
                required: [ok, database, version, revision]
                additionalProperties: false
                properties:
                  ok:
                    type: boolean
                  database:
                    type: string
                    description: |
                      The first characters of the authority's digest, which is what names a database
                      without naming it.
                  version:
                    type: string
                  revision:
                    type: string
                    description: |
                      The commit the plugin was built from, in full, or empty for a build that
                      carries none. Every build between two releases carries the same version, and
                      this is what tells them apart.
        "401":
          $ref: "#/components/responses/Unpaired"
        "503":
          $ref: "#/components/responses/Unavailable"
    head:
      operationId: headStatus
      summary: The same, without the content.
      description: |
        Runs what its `get` runs, on the same handler, and answers without the content.
        Declared rather than derived, and governed by the same `x-kpg-verb`: this document's
        own description says why.
      x-kpg-verb: none
      responses:
        "200":
          description: The gate is serving this database, and it is unlocked.
        "401":
          $ref: "#/components/responses/Unpaired"
        "503":
          $ref: "#/components/responses/Unavailable"

  /gate/whoami:
    get:
      operationId: getIdentity
      summary: Who this client is, as the database it reached admitted it.
      description: |
        What the connection established before this route was chosen: the certificate's subject,
        the client key the operator knows this client by, the admission key of the certificate on
        the connection, when the certificate stops being admitted, the profiles the rules are
        asked about for this client, and the names its record holds that the database no longer
        does. All of it is this client's own record, so it declares `x-kpg-verb: none`: it reads
        nothing a rule is about, and a client the rules let reach nothing may still ask who it is.
        What a rule grants at a node is a question about the node, which the record does not
        answer.
      # Not written to the audit, like every operation declaring `none`.
      x-kpg-verb: none
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Unpaired"
        "503":
          $ref: "#/components/responses/Unavailable"
    head:
      operationId: headIdentity
      summary: The same, without the content.
      description: |
        Runs what its `get` runs, on the same handler, and answers without the content.
        Declared rather than derived, and governed by the same `x-kpg-verb`: this document's
        own description says why.
      x-kpg-verb: none
      responses:
        "200":
          description: This client is admitted to this database.
        "401":
          $ref: "#/components/responses/Unpaired"
        "503":
          $ref: "#/components/responses/Unavailable"

  /gate/certificate:
    # A client that revokes itself grants itself nothing by it: it could already stop using its
    # certificate, and what this adds is that nobody else can start. §509
    delete:
      operationId: revokeCertificate
      summary: Revoke the certificate this request was made with.
      description: |
        A client giving up its own admission, for a certificate it no longer trusts or no longer
        needs. It takes no body, because the certificate on the connection is what is revoked and
        there is no way to name another.

        It writes what the Clients page writes, a revocation beside the record and the record
        emptied, through the single writer every change goes through, and answers once the
        database is saved and the file read back. From the next connection on the certificate is
        refused with `401 unpaired`, as one the operator revoked is. It is answered in the words
        every write is: `503 busy` covers Database Maintenance open on the database as well, whose
        write-back would put the record back without its revocation, and nothing was written, so
        asking again is safe. `401 unpaired` is also the answer when the operator revoked the
        certificate in the instant between this connection and its write.

        `x-kpg-verb: none`, because a rule says what a profile may do to groups and entries and
        this is neither: a client the rules let reach nothing may still give up the admission it
        holds.
      x-kpg-verb: none
      responses:
        "200":
          $ref: "#/components/responses/Done"
        "401":
          $ref: "#/components/responses/Unpaired"
        "500":
          description: |
            The gate failed, and the body says how. `not saved` is a revocation that was made and
            never reached the disk, and has been taken back out: the certificate is still admitted,
            and asking again is safe. `not verified` is one that was saved to a file KeePass then
            read back as something else: it is kept in the database in memory, which stays marked
            as changed, so the certificate is already refused and asking again is answered
            `401`, and whether the file keeps it is the operator's to settle. `internal error` is
            one that could not be attempted at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"

  /gate/renew:
    # What a renewal answers, each refusal included, for the dialog PAIRING.md §312 sets out. §510
    post:
      operationId: renewCertificate
      summary: Ask for a new certificate in place of the one this request was made with.
      description: |
        An admitted client asking to be renewed, which the operator approves or refuses on screen
        as a pairing is, and slow for the same reason. The certificate on the connection is what is
        renewed. The new one is issued under the same name, for the profiles its record holds that
        the database still names less any the operator unchecks, and for the lifetime the operator
        picks, with the one asked for preselected and a year when none is.

        Nothing is revoked by it. The old record is left as it is, and the client gives the old
        certificate up itself with `revokeCertificate` once the new one is stored, so an answer
        lost on the way costs nothing: the old certificate still works, and asking again raises
        the dialog again.

        It waits on a person, so it is measured against the pairing budget rather than the
        ordinary one, and it waits its turn for the screen with every pairing. `x-kpg-verb: none`,
        because a person decides it rather than a rule.

        The body is one object whose one member is optional, so `{}` asks for nothing and no
        body at all is malformed; a `400` is answered before anybody is asked. `401 unpaired` is
        also the answer when the record went between the connection and the request, or while
        the operator was deciding, in which case nothing was issued. `503 busy` covers, beside
        what `Unavailable` names, another pairing or renewal in front of the operator, a renewal
        of this same certificate still being answered, which is told so at once, and no screen to
        ask on.
      x-kpg-verb: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                lifetime:
                  type: string
                  pattern: "^P([1-9]|[1-9][0-9]|[12][0-9][0-9]|3[0-5][0-9]|36[0-5])D$"
                  description: |
                    How long the new certificate should last, spelled as on a pairing request. A
                    proposal: the dialog preselects it and the operator picks, and a renewal that
                    asks for nothing, `{}`, is offered a year.
      responses:
        "200":
          description: |
            Approved, issued, and the new record saved and read back before this was sent. The
            bundle pairing's request answers with, for the new certificate.
          content:
            application/json:
              schema:
                type: object
                required:
                  [identity, authority, gateKey, subject, database, expires, profiles]
                additionalProperties: false
                properties:
                  identity:
                    type: string
                  authority:
                    type: string
                  gateKey:
                    type: string
                  subject:
                    type: string
                  database:
                    type: string
                  expires:
                    type: string
                  profiles:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/Malformed"
        "401":
          $ref: "#/components/responses/Unpaired"
        "403":
          description: |
            The operator refused. Asking again raises the dialog again, unless the operator said
            more than once, which every later renewal of this certificate is answered `409` for.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            The operator has already answered every renewal of this certificate, so this one was
            refused without asking anybody. `this session` holds until KeePass exits: the answer
            is kept in the plugin's memory rather than in the database, so a renewal asked for
            after KeePass next starts raises the dialog. `too early` is until `notBefore`, a moment
            in UTC to the second, from which the dialog is raised again. `forever` is what it says:
            pairing again is the way to a new certificate. Each of the three also ends when the
            operator lifts it with **Allow renewal** on the clients page and accepts the settings
            dialog, and the next renewal then raises the dialog again. Nothing tells the client
            that it has: it learns by asking.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                additionalProperties: false
                properties:
                  error:
                    type: string
                  notBefore:
                    type: string
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          description: |
            One of two, and the body names which. `not recorded`: the operator approved and the new
            record did not land, or was saved to a file KeePass then read back as something else,
            and it has been taken back out; nothing was handed over, and the old certificate still
            works. `internal error`: no certificate could be issued, or the record it renews would
            not say what it holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Approving"
        "504":
          description: Nobody answered. Nothing changed, and the client may ask again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pair/hello:
    post:
      operationId: pairHello
      summary: Prove the invitation, and be proved to in return.
      description: |
        The client speaks first, so a captured name replayed at the gate is refused here rather than
        in front of the operator. The answer carries the gate's own proof, which is the only thing a
        client with no trust anchor has to go on.
      x-kpg-unauthenticated: true
      x-kpg-verb: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proof]
              additionalProperties: false
              properties:
                proof:
                  type: string
                  maxLength: 64
                  description: |
                    Base64 of HMAC-SHA256 under the invitation, over the channel binding and the
                    nonce.
      responses:
        "200":
          description: Proved. The challenge carries the exchange to the second connection.
          content:
            application/json:
              schema:
                type: object
                required: [challenge, proof, expires]
                additionalProperties: false
                properties:
                  challenge:
                    type: string
                  proof:
                    type: string
                  expires:
                    type: string
        "400":
          $ref: "#/components/responses/Malformed"
        "401":
          $ref: "#/components/responses/PairingRefused"
        "404":
          $ref: "#/components/responses/NotPairing"
        "409":
          $ref: "#/components/responses/NoInvitation"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/Unavailable"

  /pair/request:
    post:
      operationId: pairRequest
      summary: Ask to be admitted, and wait for the operator.
      description: |
        Slow on purpose: a human reads a dialog. What comes back says what was approved, which is
        not always what was asked for. The record is written and saved before the certificate is
        handed over, so a certificate the database has no record of is never issued.
      x-kpg-unauthenticated: true
      x-kpg-verb: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, profiles, proof]
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: |
                    What this client should be called. Letters, digits, space, dot, dash and
                    underscore, neither beginning nor ending with a space, which the certificate's
                    subject name would lose.
                profiles:
                  type: array
                  maxItems: 32
                  items:
                    type: string
                    minLength: 1
                    maxLength: 64
                  description: |
                    A ceiling asked for, not a grant. The operator may take any of them away.
                lifetime:
                  type: string
                  pattern: "^P([1-9]|[1-9][0-9]|[12][0-9][0-9]|3[0-5][0-9]|36[0-5])D$"
                  description: |
                    How long the certificate should last, as an ISO 8601 duration in whole days from
                    one to 365, `P30D` for thirty, and in that spelling alone. A proposal rather than
                    a grant: the dialog preselects it and the operator picks, and a request without
                    it is offered a year. The proof covers it as written.
                proof:
                  type: string
                  maxLength: 64
      responses:
        "200":
          description: |
            Admitted. The bundle is the client's identity, the authority to pin, and the gate key.
          content:
            application/json:
              schema:
                type: object
                required:
                  [identity, authority, gateKey, subject, database, expires, profiles]
                additionalProperties: false
                properties:
                  identity:
                    type: string
                  authority:
                    type: string
                  gateKey:
                    type: string
                  subject:
                    type: string
                  database:
                    type: string
                  expires:
                    type: string
                  profiles:
                    type: array
                    items:
                      type: string
        "400":
          description: |
            A request that could never have been issued as asked, answered before anything is
            spent, and the body names which of three it was. `malformed` is a body that is not what
            this declares, a lifetime its pattern refuses among them. `name` is a name its
            description does not allow, and `profile` a profile name that could not travel as a
            claim.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/PairingRefused"
        "403":
          description: The operator refused, and the invitation is spent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotPairing"
        "409":
          $ref: "#/components/responses/NoInvitation"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          description: |
            One of two, and the body names which. `not recorded`: the record did not land, so
            nothing was handed over and the invitation is spent. `internal error`: the operator
            approved and no certificate could be issued, because the authority's key would not
            sign or the authority has outlived its hundred years; the invitation is not spent, and
            the client starts again from a hello.
          content:
            application/json:
