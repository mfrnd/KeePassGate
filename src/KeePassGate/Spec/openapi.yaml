          $ref: "#/components/responses/Unpaired"
        "404":
          $ref: "#/components/responses/Unreachable"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createField
      summary: Add a string this entry does not have.
      description: |
        Refused when the name is already there, which is what makes this different from an update.
        A profile granted `update` and not `create` can change what an entry holds and cannot add
        to it.
      x-kpg-verb: create
      parameters:
        - $ref: "#/components/parameters/EntryUuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, value]
              additionalProperties: false
              properties:
                # A name every route would refuse was made with `201` and could never be read,
                # changed or stripped afterwards. A carriage return cost more: the file reads one
                # back as a line feed, so `api\rkey` and `api\nkey` were two names until the next
                # unlock and one after it, and a client holding only `create` could write beside a
                # protected field and find its own value there, in clear. The bidirectional
                # controls are refused because KeePass acts on what a name says, as the attachment
                # name beside `createAttachment` explains.
                name:
                  type: string
                  minLength: 1
                  maxLength: 512
