        a custom one, changed through its own route. `expires` moves the entry's expiry to another
        moment or, empty, takes it off, which is what a program that rotates an expired password
        needs to finish the job. A body naming none of them, or naming only what the entry already
        holds, writes nothing, as the description at the top says of every update.
