        "200":
          description: |
            The groups in the order KeePass's own tree shows them, depth first: the root, then
            each of its groups followed by everything inside that group before the next, a group's
            own groups in KeePass's order. A parent always comes before its children, and a group's
            whole subtree comes together, so a client can show the tree as the groups arrive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupList"
        "401":
          $ref: "#/components/responses/Unpaired"
