# Publishes a release. A `v` tag pushed on a commit of `master` publishes what that commit holds,
# and nothing else does: every other way in builds and checks the same things and publishes them
# nowhere, or somewhere that costs nothing.
#
# **Three ways in, and what each one may do.** A tag is a release. Running this by hand from the
# Actions page is a rehearsal: every job that publishes runs, against a target that is thrown away
# or costs nothing, so the one thing a release still does for the first time is the address it
# publishes to. A pull request that touches what a release is built from is a check: it builds
# and checks everything and publishes nothing, with no job holding more than read access.
#
# **The version is the one `Directory.Build.props` holds**, never one read off the tag, because
# that is where it is written once and where the routing document, the plugin and the client are
# held to it. The tag only picks the commit to release, and a tag naming another version is
# refused before anything is built, as is one whose changelog heading still reads unreleased, or
# one on a commit `master` does not hold.
#
# **The plugin as a GitHub release, the client on PyPI.** The plugin is installed by putting a zip's
# contents into KeePass's `plugins`, which no package manager does, so its zip and `SHA256SUMS`
# are attached to a release under the tag, with the changelog's section for the version as its
# text. That job alone may write to the repository.
#
# **PyPI last**, because a version number there can never be used again, even after deleting it:
# everything that could still fail fails before the one step that cannot be taken back. And
# through Trusted Publishing, so that no token is kept anywhere: PyPI takes the identity GitHub
# gives the job, for this repository, this file and its environment, and nothing else.
#
# **The actions are pinned by commit**, as in `gate.yml`, and for the same reason.

name: release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - build.ps1
      - CHANGELOG.md
      - Directory.Build.props
      - pyproject.toml
      - src/KeePassGate/KeePassGate.csproj
      - THIRD-PARTY-NOTICES.md
      - uv.lock
  workflow_dispatch:

concurrency:
  group: release-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  decide:
    name: what this release publishes
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      version: ${{ steps.decide.outputs.version }}
      python: ${{ steps.decide.outputs.python }}
      plugin: ${{ steps.decide.outputs.plugin }}
      client: ${{ steps.decide.outputs.client }}
    steps:
      # The whole history and every tag, because which half a patch releases is what changed since
      # the tag before it, and whether a tag may be released is whether `master` holds its commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: decide
        shell: powershell
        run: |
          $mode = switch ($env:GITHUB_EVENT_NAME) {
            'push' { 'release' }
            'workflow_dispatch' { 'rehearsal' }
            default { 'check' }
          }

          $props = Get-Content Directory.Build.props -Raw
          if ($props -notmatch '<Version>([^<]+)</Version>') {
            throw 'Directory.Build.props holds no <Version>, which is the one place a version is written.'
          }
          $version = $Matches[1]
          if ($version -notmatch '^(\d+)\.(\d+)\.(\d+)$') {
            throw "Directory.Build.props holds the version '$version', which is not a major, a minor and a patch."
          }
          $patch = [int] $Matches[3]

          if ($mode -eq 'release') {
            if ($env:GITHUB_REF_NAME -ne "v$version") {
              throw "The tag $env:GITHUB_REF_NAME names another version than the $version this commit holds. Delete it, and tag v$version or the commit that holds the version wanted."
            }
            & git merge-base --is-ancestor HEAD origin/master
            if ($LASTEXITCODE -ne 0) {
              throw "The tag $env:GITHUB_REF_NAME is on a commit master does not hold, and a release is only ever of one that went through the gate."
            }
          }

          # The heading is the version, then the half a patch releases, then unreleased until it
          # is not. A release refuses a heading that still reads unreleased, since the changelog
          # would then be wrong the moment the release is out. A rehearsal and a check take it,
          # because they run before the pull request that marks it released.
          $heading = @(Get-Content CHANGELOG.md | Where-Object { $_ -match "^## $([regex]::Escape($version))(,|$)" })
          if ($heading.Count -ne 1) {
            throw "CHANGELOG.md has $($heading.Count) headings for $version, where a version has exactly one."
          }
          if ($mode -eq 'release' -and $heading[0] -match 'unreleased') {
            throw "CHANGELOG.md still calls $version unreleased: '$($heading[0])'."
          }

          # A minor version releases both halves, a patch the half whose files it changed since the
          # tag before it, CONVENTIONS.md "Versions". Only a release asks, because a rehearsal and
          # a check are there to try everything.
          $plugin = $true
          $client = $true
          if ($mode -eq 'release' -and $patch -ne 0) {
            # Asked with errors let through, since Windows PowerShell turns what git writes to
            # standard error into a stopping error under the runner's preference, and no tag
            # before this one is an answer rather than a failure.
            $ErrorActionPreference = 'Continue'
            $previous = & git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>$null
            $found = $LASTEXITCODE -eq 0
            $ErrorActionPreference = 'Stop'
            if (-not $found -or -not $previous) {
              throw "v$version is a patch, and no tag before it shows what it patches."
            }
            $changed = @(& git diff --name-only "$previous" HEAD)
            $plugin = [bool] @($changed | Where-Object { $_ -like 'src/KeePassGate/*' }).Count
            $client = [bool] @($changed | Where-Object { $_ -like 'src/pykeepassgate/*' -or $_ -eq 'pyproject.toml' }).Count
            Write-Host "Changed since ${previous}: $($changed.Count) file(s); the plugin $(if ($plugin) { 'ships' } else { 'does not' }), the client $(if ($client) { 'ships' } else { 'does not' })."
            if (-not $plugin -and -not $client) {
              throw "v$version is a patch that changed neither half since $previous, so it has nothing to release."
            }
          }

          # A rehearsal publishes to TestPyPI under a development version of its own, since a
          # number taken there cannot be taken again either, and the run number never repeats.
          $python = if ($mode -eq 'rehearsal') { "$version.dev$env:GITHUB_RUN_NUMBER" } else { $version }

          Write-Host "mode $mode, version $version, plugin $plugin, client $client as $python"
          # Without a byte order mark, which Windows PowerShell's own UTF-8 writes first, and which
          # would then be part of the first name.
          $lines = "mode=$mode", "version=$version", "python=$python",
            "plugin=$($plugin.ToString().ToLowerInvariant())", "client=$($client.ToString().ToLowerInvariant())"
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, (($lines -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding $false))

  plugin:
    name: the plugin, packaged and checked
    needs: decide
    if: needs.decide.outputs.plugin == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # The whole history, since `Package` builds only a commit of a clone and stamps every entry
      # in the zip with the time it was committed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: the pinned KeePass
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .keepass
          key: keepass-${{ hashFiles('keepass.sha256') }}

      # `Package` reads the zip and its sums back before it reports them; what is asked here is
      # only that the zip is the version this run decided, beside its sums and nothing else.
      - name: package
        shell: powershell
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          ./build.ps1 -Task Package
          $names = @(Get-ChildItem dist | ForEach-Object Name | Sort-Object)
          if (($names -join ' ') -ne "KeePassGate-$env:VERSION.zip SHA256SUMS") {
            throw "dist holds $($names -join ', '), where a release of $env:VERSION attaches its zip and SHA256SUMS."
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: dist/
          if-no-files-found: error

  # A release under the tag, with the changelog's section for the version as its text and the
  # plugin's files attached when the plugin ships. A rehearsal makes the same release as a draft
  # under a tag nobody pushed, which a draft does not create, reads every file back, and deletes
  # it again. A release reads its files back too: an upload that reported success and attached
  # something else is found here, before PyPI.
  #
  # The status function is GitHub's, and keeps GitHub's spelling. cspell:ignore cancelled
  github:
    name: the release on GitHub
    needs: [decide, plugin]
    if: >-
      !cancelled() && needs.decide.result == 'success' && needs.decide.outputs.mode != 'check' &&
      (needs.plugin.result == 'success' || needs.plugin.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ needs.decide.outputs.mode }}
      VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: needs.decide.outputs.plugin == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin
          path: dist/

      - name: release
        run: |
          # The changelog's links are relative to the repository, and a release page is not, so
          # each is pointed at the commit being released.
          awk -v heading="## $VERSION" 'index($0, heading ",") == 1 || $0 == heading { on = 1; next } on && /^## / { exit } on' \
            CHANGELOG.md |
            sed -E "s#\]\(([^):/#][^):]*)\)#](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/\1)#g" > notes.md
          test -s notes.md

          # No files at all for a patch to the client alone, whose release is its text.
          mkdir -p dist
          files=()
          for file in dist/*; do
            if [ -e "$file" ]; then files+=("$file"); fi
          done
          if [ "$MODE" = release ]; then
            tag="v$VERSION"
            gh release create "$tag" --verify-tag --title "KeePassGate $VERSION" --notes-file notes.md "${files[@]}"
          else
            tag="v$VERSION-rehearsal.$GITHUB_RUN_NUMBER"
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "KeePassGate $VERSION, rehearsed" \
              --notes-file notes.md "${files[@]}"
          fi

          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$tag\") | .id")
          test -n "$id"
          if [ "$MODE" != release ]; then
            trap 'gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"' EXIT
          fi

          mkdir back
          gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --jq '.[] | "\(.id) \(.name)"' |
            while read -r asset name; do
              gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "back/$name"
            done
          diff -r dist back

          if [ "$MODE" != release ] && git ls-remote --exit-code --tags origin "refs/tags/$tag"; then
            echo "The rehearsal's draft made the tag $tag, which a draft does not." >&2
            exit 1
          fi

  client:
    name: the client, built and checked
    needs: decide
    if: needs.decide.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # Only a rehearsal writes another version, into this checkout and nowhere else, since
      # hatchling reads it from the same line the plugin does.
      - name: the rehearsal's own version
        if: needs.decide.outputs.python != needs.decide.outputs.version
        env:
          VERSION: ${{ needs.decide.outputs.version }}
          PYTHON: ${{ needs.decide.outputs.python }}
        run: |
          sed -i "s|<Version>$VERSION</Version>|<Version>$PYTHON</Version>|" Directory.Build.props
          grep -q "<Version>$PYTHON</Version>" Directory.Build.props

      # A wheel and a source distribution, each named for the version, and nothing else: anything
      # more in the directory would be uploaded beside them.
      - name: build
        env:
          PYTHON: ${{ needs.decide.outputs.python }}
        run: |
          uv build --out-dir dist
          ls dist
          test -f "dist/pykeepassgate-$PYTHON-py3-none-any.whl"
          test -f "dist/pykeepassgate-$PYTHON.tar.gz"
          test "$(ls dist | wc -l)" -eq 2
          uv run --frozen twine check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client
          path: dist/
          if-no-files-found: error

  # A rehearsal's upload, to TestPyPI, which is a separate index with accounts and projects of its
  # own: what lands there is a development version nobody installs by accident.
  testpypi:
    name: the client, rehearsed on TestPyPI
    needs: [decide, client]
    if: needs.decide.outputs.mode == 'rehearsal'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pykeepassgate/${{ needs.decide.outputs.python }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  # After the release on GitHub, which runs whether or not the plugin ships, so a client-only patch
  # waits for it as well, and spelled out because a skipped plugin job would otherwise skip this.
  pypi:
    name: the client, published on PyPI
    needs: [decide, client, github]
    if: >-
      !cancelled() && needs.decide.outputs.mode == 'release' &&
      needs.client.result == 'success' && needs.github.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pykeepassgate/${{ needs.decide.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
