# Runs the desktop probe on a hosted runner, which is the whole of this spike.
#
# Triggered by a push to this branch, which is not the preference but is the only thing that works.
# GitHub offers `workflow_dispatch` only for workflows that are on the **default branch**, and a
# spike is deliberately not on it, so dispatching this one is refused with "could not find any
# workflows named". The dispatch trigger is kept anyway, for whoever puts a workflow on `master`
# later and can then use it.
#
# The cost is that a push re-measures rather than reading `RESULTS.md`. This branch is pushed
# rarely and the job is about a minute, so that is cheaper than it would be anywhere else in this
# repository, where Windows bills at twice the rate.
#
# The probe's exit code is the verdict, so a red job here means a machine that cannot drive a GUI
# rather than a job that failed to run one.

name: hosted runner desktop

on:
  push:
    branches: [spikes/hosted-runner-desktop]
  workflow_dispatch:

jobs:
  probe:
    name: can a GUI be driven here
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: what the image is
        shell: powershell
        run: |
          Write-Host ("image=" + $env:ImageOS + " " + $env:ImageVersion)
          Write-Host ("os=" + [Environment]::OSVersion.VersionString)

      - name: probe
        shell: powershell
        run: .\.github\desktop-probe.ps1
