# Runs the gate. Whatever `build.ps1` says its checks are, this runs each of them as a job, on the
# runner the script names for it.
#
# **The job list is not written here, and nor is where a job runs.** Both are `build.ps1 -ListGates`,
# read at run time, one line per check and runner, so a task added to the script, or a runner added
# for one, is checked by CI without anybody editing this file, and there is no second list that
# could disagree with the first. That is the whole design: the list is never written here, however
# many steps the repository grows.
#
# **The actions are pinned by commit**, with the release each commit is beside it, because a tag is
# whatever its maintainers move it to next, and what every run executes would then change with no
# commit here to show it. The pins are the one thing in this file expected to change: when an
# action's maintainers retire the runtime it runs on, a newer release is pinned here, in a commit of
# its own.
#
# **Pull requests, and pushes to `master` only.** Every step's branch is stacked on the one below
# it and its pull request is based there, so a push to the branch and the pull request's merge
# result check the same tree, and running on both would check it twice. A pull request is checked
# once, as the merge it would make, and `master` after every merge. A branch with no pull request
# gets no run from this file. A pull request's run gives way to a newer push to it, and to nothing
# else: its group is named for the pull request's number, so two pull requests never share one.
# Every push to `master` runs in a group of its own, named for the commit, so no merge's check is
# canceled or replaced. The group used to be named for the ref, and pull requests' checks were
# canceled in `master`'s group while a stack of them was being merged.
#
# **One check is the one a merge waits for**, `gate passed`, which the ruleset on `master` requires.
# It needs every other job and passes only when all of them did, so the ruleset names one check
# rather than the list `build.ps1 -ListGates` answers, which would go stale the first time a gate
# was added or a runner was given one.
#
# **Read access and nothing more.** No step writes to the repository, so every job's token is
# declared read only here rather than left to whatever the repository's settings grant.
#
# **Which is why the setup below tolerates what does not exist yet.** A branch early in the build
# order has no `uv.lock` and no pinned KeePass, and a later one has both. Each of those steps is
# guarded on the file that proves its subject has arrived, rather than on a step number this file
# would then have to know about.
#
# **`windows-latest` for everything Windows does**, including the short job that only reads the task
# list. This is a Windows repository and the gate is Windows PowerShell; running a job on a cheaper
# image would buy about a minute a month and introduce the one difference nobody would think to
# check. That a hosted runner can do all of it, including driving a real KeePass across a desktop,
# is measured on `spikes/hosted-runner-desktop` rather than assumed. **The client is the exception**:
# it is a Python package that installs anywhere, so the script runs its check on `ubuntu-latest`
# as well, under PowerShell 7, where the tests of a credential file's mode can run at all.

name: gate

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: gate-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gates:
    name: what this branch checks
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      list: ${{ steps.ask.outputs.list }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # An empty list is refused rather than passed on. A matrix over nothing produces no jobs and
      # a green check, which is the one outcome worse than a red one: it reports that a branch was
      # checked when nothing ran.
      - id: ask
        shell: powershell
        run: |
          $gates = @(& .\build.ps1 -ListGates)
          if (-not $gates) {
            throw 'build.ps1 declares no gates. A green check here would say this branch was checked when nothing ran.'
          }
          Write-Host "gates: $($gates -join ', ')"

          # One job per line, which is a check and the runner it runs on. A line that is not both
          # is refused rather than guessed at, since a job with no runner fails in a way that names
          # nothing about why.
          #
          # Spelled out rather than handed to ConvertTo-Json, which renders a one element array as
          # a bare object. A branch with a single gate would then produce no matrix at all, and the
          # first branch in this repository has exactly one.
          $jobs = foreach ($line in $gates) {
            $task, $runner, $rest = @($line -split ' ')
            if (-not $task -or -not $runner -or $rest) {
              throw "build.ps1 -ListGates said '$line', which is not a check and a runner."
            }
            '{"task":"' + $task + '","runner":"' + $runner + '"}'
          }
          $list = '[' + (@($jobs) -join ',') + ']'
          "list=$list" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

  gate:
    name: ${{ matrix.task }} on ${{ matrix.runner }}
    needs: gates
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      # Every check reports for itself. One failure hiding the others would mean a second push to
      # learn the second thing.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gates.outputs.list) }}
    # Windows PowerShell on Windows, which is what the gate is written for, and PowerShell 7
    # everywhere else, where there is no other. Here rather than on each step, because a step's
    # own `shell` reads no expression and a job's default does.
    defaults:
      run:
        shell: ${{ startsWith(matrix.runner, 'windows') && 'powershell' || 'pwsh' }}
    steps:
      # The whole history, because the anchors check reads every commit that ever touched a
      # document and compares against `HEAD^`, and a depth-one clone has neither. The job above
      # does not need it: it only asks the script what its checks are.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # No version named, because this repository pins none: the prose tools are pinned in
      # `package-lock.json` and the runner's own Node runs them. This is here for the cache.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          cache: npm

      - name: uv, where the client exists
        if: hashFiles('uv.lock') != ''
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      # Windows only, because only there is KeePass provided: a check on another system has no
      # KeePass to build against, and a cache of nothing is a warning on every run.
      - name: the pinned KeePass, where one is pinned
        if: runner.os == 'Windows' && hashFiles('keepass.sha256') != ''
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .keepass
          key: keepass-${{ hashFiles('keepass.sha256') }}

      # A forward slash, which both PowerShells read as a separator on every system.
      - name: ${{ matrix.task }}
        run: ./build.ps1 -Task ${{ matrix.task }}

      # The end to end tier starts a real KeePass. One left running holds the job open until the
      # timeout, which costs minutes and says nothing. There is none to leave anywhere else.
      - name: leave nothing running
        if: always() && runner.os == 'Windows'
        run: Get-Process KeePass -ErrorAction SilentlyContinue | Stop-Process -Force

  # Always run, because a job skipped after a failure above it reports as skipped, and a skipped
  # required check is one a merge does not wait on. Anything but success from every job is a
  # failure here, a cancellation and a skip included.
  passed:
    name: gate passed
    needs: [gates, gate]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - shell: powershell
        env:
          LISTED: ${{ needs.gates.result }}
          CHECKED: ${{ needs.gate.result }}
        run: |
          if ($env:LISTED -ne 'success' -or $env:CHECKED -ne 'success') {
            throw "Listing the gates ended as $env:LISTED and running them as $env:CHECKED."
          }
