# The checks that are cheap enough to run on what is being committed rather than on everything.
#
# **Two kinds of hook.** The local ones, the style, the types, the spelling and the markdown, are
# not a second set of rules: each runs the tool the gate runs, against the config the gate reads,
# so a commit they pass passes `build.ps1` for the same reasons, and what they buy is distance: a
# finding at the commit costs a sentence, and the same finding at the gate costs a rebuild. The
# others are guards the gate does not have, against a merge left half done, a last line with no
# line ending, trailing whitespace, YAML or TOML that does not parse, a large file, a private key
# and a database. The gate holds whitespace and line endings only in the Python and the Markdown,
# each by its own tool, and none of the rest at all, so a commit can be refused here for something
# the gate passes.
#
# **What is deliberately not here.** The C# build and the test suites. They take minutes, and a
# pre-commit hook people are tempted to skip is worse than one that never existed. `build.ps1` is
# the gate; this is the fast part of it.
#
# Install it once:
#
#     uv run pre-commit install
#
# It lives with the Python client because `pre-commit` is a Python tool and `uv` is what this
# repository uses to run those.
repos:
  # By commit, with its release in the comment Dependabot reads and moves with it, for the reason
  # `gate.yml` pins its actions that way: a tag is whatever its maintainers move it to next, and
  # this is code that runs at every commit on whoever's machine installed it.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      # The five that catch a mistake nobody would make on purpose.
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      # A `.kdbx` must never be committed, and neither must a key. Size alone catches neither,
      # since a scratch database and a PEM key are both small, so the two rules that do are by
      # content and by name. The size limit stays for everything else.
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: detect-private-key
        # `test_credentials.py` asserts that the identity it wrote holds a private key, and
        # the way it asks is the header this hook looks for. `credentials.py` tells a key held
        # in the clear from an encrypted key by the same headers, and `test_key_password.py`
        # asserts which of the two a file was written as. A vector or a test that names a
        # thing is not the thing, which is the same reason `pyproject.toml` carries per-file
        # ignores for the tests.
        exclude: '^(src/pykeepassgate/credentials|tests/pykeepassgate/test_(credentials|key_password))\.py$'

  - repo: local
    hooks:
      # Style, types and spelling all run locally rather than from a mirror, because each
      # needs this repository's own config and its own environment to mean anything. Ruff
      # was pinned to a mirror revision and disagreed with the one `uv.lock` resolves, so
      # the mirror flagged what the gate passed. That is the header above being false in
      # the one way it is most expensive to discover. No `--fix`: a hook that rewrites a
      # file during `git commit` is a hook that commits something nobody read.
      - id: ruff
        name: style
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types: [python]

      - id: ruff-format
        name: format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
        # Kept for running by hand and deliberately in no gate, because this repository's
        # Python is written to be read and `ruff format` would reflow comments that were
        # wrapped on purpose. `stages: [manual]` is what keeps it out of a commit.
        stages: [manual]

      - id: mypy
        name: types
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: cspell
        name: spelling
        entry: npx --no-install cspell lint --no-progress --no-summary
        language: system
        pass_filenames: true
        # Passing filenames goes around `cspell.yaml`'s own include list, so without this
        # the hook checks files the gate never does and reports words this repository has
        # no reason to know. `.gitignore` and `LICENSE` are among the files it would check.
        files: '\.(md|cs|ps1|py|ya?ml|json|toml|csproj|props)$'

      # `--no-globs`, because markdownlint-cli2 otherwise adds the configuration's own globs to
      # the files named, lints every markdown file in the tree, untracked drafts among them, and
      # refuses a commit over a file it does not hold.
      - id: markdownlint
        name: markdown
        entry: npx --no-install markdownlint-cli2 --no-globs
        language: system
        files: '\.md$'

      # By name, because the only thing that reliably identifies a database here is its extension,
      # and a throwaway one made by a test is exactly the file most likely to be staged by accident.
      - id: no-database
        name: refuse a database file
        entry: A .kdbx must never be committed, not even a throwaway one.
        language: fail
        files: '\.kdbx$'
