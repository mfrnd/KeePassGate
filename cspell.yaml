version: "0.2"
language: en-US

enableFiletypes:
  - csharp
  - powershell
  - python

files:
  - "**/*.md"
  - "**/*.cs"
  - "**/*.ps1"
  - "**/*.py"
  - "**/*.yaml"
  - "**/*.yml"
  - "**/*.json"
  - "**/*.toml"
  - "**/*.csproj"
  - "**/*.props"

# **What git ignores is not ours to spell.** The globs above match dot-prefixed paths only because
# the gate runs with `--dot`, and it does because this repository keeps files of its own there: the
# assistant's settings under `.claude`, and the configuration at the root. `--dot` on its own would
# walk into every directory a tool makes as well, which is what this keeps out: `.gitignore` already
# says what is not ours, and it is maintained for its own reasons.
useGitignore: true

ignorePaths:
  # The evaluation's working papers, kept as they were written and checked against nothing here.
  # `papers/README.md` is this branch's own prose and is checked.
  - papers/ground/**
  - papers/options/**
  - papers/draft/**
  # Somebody else's source, vendored or generated. Not ours to spell, and a checker that reports it
  # is a checker whose findings nobody reads. The spike branches vendor whole libraries under
  # `vendor/`, which is what that first line is for.
  - "**/vendor/**"
  - "**/*.generated.cs"
  - node_modules/**
  - "**/bin/**"
  - "**/obj/**"
  - .tmp/**
  - scratchpad/**
  - package-lock.json
  - "**/*.kdbx"

ignoreRegExpList:
  # A run of hex, which covers fingerprints, key identifiers and the SNI labels.
  - "/\\b[0-9a-fA-F]{8,}\\b/g"
  # base64 and base64url, which covers certificates, tokens and invitations.
  - "/\\b[A-Za-z0-9+/_-]{20,}={0,2}\\b/g"
  # A URL, whose path is somebody else's spelling.
  - "/https?:\\/\\/[^\\s)\"'`]+/g"

words:










  # This project
  - KeePassGate
  - kdbx
  - keepass



  # KeePass's own names, which are spelled the way KeePass spells them
  - Kdbx
  - Dominik
  - Reichl



  # Tooling
  - LASTEXITCODE
  - noresult
  - Authenticode
  - pscustomobject
  - worktree
  - worktrees



  # More of the platform, and of the wire
  - Ecas

  # What this branch's own sources and prose need, over what the mainline already knows: the key
  # of the option that keeps the store as conflict-free replicated data types.
  - crdt

  # KeePassXC and its publisher, spelled as they spell themselves.
  - KeePassXC
  - keepassxc
  - DroidMonkey

  # Identifiers in the rules-on-node probes, which are carried unchanged: the label
  # `prefixKPGdot` printed by the collation script, the case directory `C4-norecords`, and
  # `ordinally` in a line the security critic's `Attack.cs` prints.
  - Gdot
  - norecords
  - ordinally

  # Programs and libraries the store-entries probes run, spelled as their projects spell them.
  - pykeepass
  - kdbxweb
  - lxml
  - fflate
  - Bitwarden
  # Identifiers in the store-entries probes, which are carried unchanged: the `kpmerge` verb of
  # the design's `Sep.exe`, and `unretired` in the survival critique's `Surv.cs`.
  - kpmerge
  - unretired
  # Identifiers in the ground-keepass probe, which is carried unchanged: the variant `nobackup`
  # its X2 prints, which the family's `x2.py` and `RUN.md` match, and the local `scen` of X3.
  - nobackup
  - scen
  # Identifiers in the ground-keepassxc probe, which is carried unchanged: the entries
  # `both-samefield` and `del-A-unch`, the local `gdel` and the verb `kpsync` of `Xcp.exe`, and the
  # directory `histmax` its steps write; and `fileversion`, the label `logs\download.log` gives the
  # version a release reports, which the family's replay writes the same way.
  - samefield
  - unch
  - gdel
  - kpsync
  - histmax
  - fileversion
  # Identifiers in the ground-others probes, which are carried unchanged: the copy `Btie`, the
  # group rule `grule-base` and the label `customdata` of `Kp.cs`. And two programs, spelled as
  # their projects spell them.
  - Btie
  - grule
  - customdata
  - KeePassium
  - gokeepasslib
  # Identifiers in the ground-measured probe, which is carried unchanged: the key derivation sets
  # `slowm` the re-read's list selects, and the directories `kpdx-<release>` of the Android
  # results its checks read. And `apksigner`, Android's own tool, which the pin file
  # `android.sha256` names.
  - slowm
  - kpdx
  - apksigner
