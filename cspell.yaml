version: "0.2"
language: en-US

enableFiletypes:
  - csharp
  - powershell
  - python

files:
  - "**/*.md"
  - "**/*.cs"
  - "**/*.ps1"
  - "**/*.py"
  - "**/*.yaml"
  - "**/*.yml"
  - "**/*.json"
  - "**/*.toml"
  - "**/*.csproj"
  - "**/*.props"

# **What git ignores is not ours to spell.** The globs above match dot-prefixed paths only because
# the gate runs with `--dot`, and it does because this repository keeps files of its own there: the
# assistant's settings under `.claude`, and the configuration at the root. `--dot` on its own would
# walk into every directory a tool makes as well, which is what this keeps out: `.gitignore` already
# says what is not ours, and it is maintained for its own reasons.
useGitignore: true

ignorePaths:
  # Somebody else's source, vendored or generated. Not ours to spell, and a checker that reports it
  # is a checker whose findings nobody reads. The spike branches vendor whole libraries under
  # `vendor/`, which is what that first line is for.
  - "**/vendor/**"
  - "**/*.generated.cs"
  - node_modules/**
  - "**/bin/**"
  - "**/obj/**"
  - .tmp/**
  - scratchpad/**
  - package-lock.json
  - "**/*.kdbx"

ignoreRegExpList:
  # A run of hex, which covers fingerprints, key identifiers and the SNI labels.
  - "/\\b[0-9a-fA-F]{8,}\\b/g"
  # base64 and base64url, which covers certificates, tokens and invitations.
  - "/\\b[A-Za-z0-9+/_-]{20,}={0,2}\\b/g"
  # A URL, whose path is somebody else's spelling.
  - "/https?:\\/\\/[^\\s)\"'`]+/g"
  # A code point written as an escape, which is a number rather than a word. It appears in C# and
  # in the JSON this serves, and both spell it the same way.
  - "/\\\\u[0-9a-fA-F]{4}/g"

words:



  # provide keepass as a pinned, verified portable install
  - Authenticode
  - pscustomobject

  # KeePass's author, whose Authenticode signature is what a download is checked against
  - Dominik
  - Reichl



  # start the reference client, with the checks it is held to
  - addopts
  - conftest
  - docstrings
  - isort
  - pathlib
  - pycodestyle
  - pydocstyle
  - pyflakes
  - pytest
  - pyupgrade
  - testpaths

  # keep the gate working on a machine that also has PowerShell 7
  - PSHOME


  # This project
  - KeePassGate
  - PyKeePassGate
  - pykeepass
  - kdbx
  - keepass



  # KeePass's own names, which are spelled the way KeePass spells them
  - Kdbx
  - plgx

  # Cryptography and the transport
  - DPAPI
  - HMAC
  - secp

  # The platform
  - CREAT
  - msbuild
  - netstandard
  - SChannel
  - vswhere

  # Tooling
  - mypy
  - pyproject
  - sdist
  - autonumber
  - LASTEXITCODE
  - nologo
  - noresult
  - Parallelizable
  - pathspec
  - USERPROFILE

  # Names of other people's projects, spelled the way they spell them
  - Connexion
  - httparse
  - Newtonsoft
  - Nowin
  - picohttpparser
  - Swashbuckle
  - wasmtime
  - libwasmtime

  # More of the platform, and of the wire
  - Consolas
  - Ecas
  - HMACSHA
  - keybd
  - nameof
  - netsh
  - nosniff
  - OCSP
  - oids
  - SPIFFE
  - sslcert
  - syscall

  # Words this project uses on purpose. Each is the shortest way to say the thing, and each has
  # earned its place by appearing in more than one document.
  - desync
  - interoperating
  - middleboxes
  - readback
  - recompiler
  - refusable
  - reimplementations
  - replayable
  - sandboxing
  - unadmitted
  - unparseable
  - unpayable
  - unshown
