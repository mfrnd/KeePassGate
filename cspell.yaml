# **The British spelling of a word, refused wherever it is written.** This repository writes American
# English, and choosing the language catches only part of that: the American dictionary accepts
# much of the British doubled L, and a language's own dictionary accepts more of the rest. These are
# refused whichever dictionary knows them, in prose, in comments and in every identifier cspell
# reads, which it splits into its words. A name belonging to somebody else keeps its own spelling,
# with a `cspell:ignore` beside it naming the word, rather than a hole in this list.
#
# The list is the one place such a word belongs, so the check is off from here to its end and on
# again after it.
# cspell:disable
